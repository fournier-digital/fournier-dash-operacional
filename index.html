      /* ---------------- DEMANDAS ---------------- */
      function Demandas({ escolas, showSquad, abrirCliente, resp, setResp, reps, respTasks, respLoading }) {
        const hoje0 = new Date(FD.NOW); hoje0.setHours(0, 0, 0, 0);
        const diffDias = (iso) => { const d = new Date(iso); d.setHours(0, 0, 0, 0); return Math.round((d - hoje0) / 86400000); };

        const idPorNome = {};
        escolas.forEach((e) => { idPorNome[e.nome] = e.id; });

        // modo pessoa = TODAS as tarefas do responsável (qualquer lista, sob demanda);
        // modo normal = demandas (Demandas Novas) de todos os clientes do squad.
        const modoPessoa = !!resp;
        // Separação por squad: esconde demandas atribuídas a alguém do OUTRO squad
        // (ex.: Bruno/Cauã não aparecem no Laranja; João/Jon não aparecem no Azul).
        // Caio está nos dois, então nunca é escondido. Não-representantes ficam.
        const repsSet = new Set(reps || []);
        const outros = TODOS_REPS.filter((n) => !repsSet.has(n));
        const daOutraSquad = (d) => outros.some((r) => matchResp(d, r)) && !(reps || []).some((r) => matchResp(d, r));
        let linhas = [];
        if (modoPessoa) {
          linhas = (respTasks || []).filter((d) => d.status !== "concluída")
            .map((d) => ({ ...d, escola: { id: idPorNome[d.cliente], nome: d.cliente, squad: d.squad } }));
        } else {
          escolas.forEach((e) => e.demandas.filter((d) => d.status !== "concluída" && !daOutraSquad(d)).forEach((d) => linhas.push({ ...d, escola: e })));
        }

        // carga por responsável (atraso = prazo no passado)
        const porResp = {};
        linhas.forEach((d) => {
          const r = porResp[d.responsavel] = porResp[d.responsavel] || { total: 0, atrasadas: 0, squad: d.escola.squad };
          r.total++; if (d.prazo && diffDias(d.prazo) < 0) r.atrasadas++;
        });
        const gargalos = Object.entries(porResp).sort((a, b) => b[1].atrasadas - a[1].atrasadas || b[1].total - a[1].total);

        // buckets por prazo
        const buckets = { atras: [], hoje: [], prox: [], sem: [] };
        linhas.forEach((d) => {
          if (!d.prazo) return buckets.sem.push(d);
          const k = diffDias(d.prazo);

                <div className="flex flex-wrap gap-x-4 gap-y-1 text-slate-300"><span>LTV médio: <b className="text-emerald-300">{R.ltvMedio != null ? R.ltvMedio + " meses" : "—"}</b></span><span>LTV 2m+: <b className="text-emerald-300">{R.ltv2m != null ? R.ltv2m + " meses" : "—"}</b></span><span>Churn: <b className="text-rose-300">{R.churn}</b> ({R.churnRate}%)</span><span>Retidos 2m+: <b>{R.retidos2m}</b></span></div>
                <div><div className="text-slate-400 mb-1">Colunas detectadas <span className="text-emerald-300">(verde = reconhecida)</span></div><div className="flex flex-wrap gap-1">{(d.headers || []).map((h, i) => { const rot = rotulo(i); return <span key={i} className={`text-[11px] px-2 py-0.5 rounded-full border ${rot ? "bg-emerald-500/15 text-emerald-200 border-emerald-700" : "bg-slate-800 text-slate-400 border-slate-700"}`}>[{i}] {(h || "—").slice(0, 24)}{rot ? ` · ${rot}` : ""}</span>; })}</div></div>
                <div><div className="text-slate-400 mb-1">Amostra (cliente → tempo de casa · motivo se saiu)</div><div className="space-y-1">{d.clientes.slice(0, 8).map((c, i) => <div key={i} className="rounded bg-slate-800/60 px-2 py-1 flex items-center justify-between gap-2"><span className="text-slate-200 truncate">{c.nome}{c.saiu ? <span className="text-rose-300"> · saiu</span> : ""}</span><span className="text-slate-400 shrink-0 text-[11px]">{c.tenureMeses != null ? c.tenureMeses + "m" : "—"}{c.saiu && c.motivo ? " · " + c.motivo.slice(0, 30) : ""}</span></div>)}{d.clientes.length === 0 && <div className="text-amber-400/80">Nenhuma linha detectada — confira o compartilhamento e a coluna de clientes.</div>}</div></div>
                <div className="text-[11px] text-slate-500">Lê a aba-mestre <b>Clientes_Ativos_e_Inativos</b> (ativos + inativos). Se entrada/saída/situação/meses ficaram sem rótulo verde, me diga o cabeçalho que eu ajusto.</div>
              </div>
            )}
          </div>
        );
      }
      function Integracoes({ squads, onSaved }) {
        const fontesDef = FD.integrations.lista();
        const [cfg, setCfg] = useState(() => FD.configStore.load());
        const [salvo, setSalvo] = useState(false);
        const setCampo = (squad, fonte, key, value) => { setCfg((prev) => ({ ...prev, [squad]: { ...prev[squad], [fonte]: { ...prev[squad][fonte], [key]: value } } })); setSalvo(false); };
        const salvar = () => {
          FD.configStore.save(cfg); // localStorage (fallback/imediato)
          // + grava no Supabase (cross-device) via proxy — os segredos vão browser->proxy->banco
          fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cfg) }).catch(() => {});
          onSaved && onSaved(); setSalvo(true);
        };
        const squadCount = (squad) => fontesDef.filter((f) => FD.integrations[f.key].conectado(squad)).length;
        return (
          <div className="space-y-4">
            <div className={`${CARD} p-4`}><h1 className={`text-lg ${H}`}>Integrações</h1><p className="text-sm text-slate-400 mt-1">Vincule as credenciais/links das ferramentas. Salvo <b>só neste navegador</b> (localStorage). No <b>ClickUp</b>, cada <b>squad = um Space</b>. Use <b>Listar meus spaces</b> para achar o ID e <b>Testar conexão</b> para ver os clientes e demandas reais.</p></div>
            <div className={`grid grid-cols-1 ${squads.length > 1 ? "lg:grid-cols-2" : ""} gap-4`}>
              {squads.map((squad) => (
                <div key={squad} className={`${CARD} overflow-hidden`}>
                  <div className="flex items-center justify-between px-4 py-2.5 border-b border-slate-800" style={{ backgroundColor: SQUADS[squad].cor + "1a" }}><SquadBadge squad={squad} /><span className="text-[12px] text-slate-400">{squadCount(squad)}/{fontesDef.length} configuradas</span></div>
                  <div className="p-4 space-y-4">{fontesDef.map((f) => { const ok = FD.integrations[f.key].conectado(squad); return <div key={f.key} className="border border-slate-800 rounded-xl p-3"><div className="flex items-center justify-between mb-2"><div><div className="font-bold text-slate-200 text-sm">{f.nome}</div><div className="text-[11px] text-slate-500">{f.descricao}</div></div><span className={`text-[11px] px-2 py-0.5 rounded-full font-semibold ${ok ? "bg-emerald-500/15 text-emerald-300" : "bg-slate-800 text-slate-500"}`}>{ok ? "✓ configurado" : "não configurado"}</span></div><div className="space-y-2">{f.campos.map((campo) => <CampoIntegracao key={campo.key} campo={campo} valor={cfg[squad][f.key][campo.key] || ""} onChange={(v) => setCampo(squad, f.key, campo.key, v)} />)}</div>{f.key === "clickup" && <DiagClickUp squad={squad} getCreds={() => cfg[squad].clickup} onPickSpace={(id) => setCampo(squad, "clickup", "spaceId", id)} />}{f.key === "googleCalendar" && <DiagCalendar squad={squad} getCreds={() => cfg[squad].googleCalendar} />}{f.key === "nps" && <DiagNps squad={squad} getCreds={() => cfg[squad].nps} />}{f.key === "controle" && <DiagControle squad={squad} getCreds={() => cfg[squad].controle} />}{f.key === "ltv" && <DiagLtv squad={squad} getCreds={() => cfg[squad].ltv} />}</div>; })}</div>
                </div>
              ))}
            </div>
            <div className="flex items-center gap-3 sticky bottom-0 bg-slate-950/70 backdrop-blur py-3"><button onClick={salvar} className="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-xl px-4 py-2">Salvar credenciais</button>{salvo && <span className="text-sm text-emerald-400 font-medium">✓ salvo</span>}</div>
          </div>
        );
      }

      /* ---------------- APP ---------------- */
      const ClienteDetailMemo = React.memo(ClienteDetail); // pula re-render quando escola/voltar não mudam
      function App() {
        const [sessao, setSessao] = useState(() => FD.auth.sessao());
        const [todas, setTodas] = useState(null);
        const [squad, setSquad] = useState("todos");
        const [view, setView] = useState("resumo");
        const [selId, setSelId] = useState(null);
        const [backView, setBackView] = useState("clientes");
        const [, setTick] = useState(0);
        const [busca, setBusca] = useState("");
        const [resp, setResp] = useState(null);
        const [respTasks, setRespTasks] = useState(null);
        const [respLoading, setRespLoading] = useState(false);
        const [navDir, setNavDir] = useState(""); // "in" (abrir cliente) | "out" (voltar) | "" (neutro)

        // Render progressivo: pinta a carteira do ClickUp assim que chega
        // (1º setTodas via callback) e re-pinta com NPS/Agenda/Controle (2º setTodas).
        const [snapEm, setSnapEm] = useState(null);
        const vivoRef = React.useRef(true);
        // Recarrega AO VIVO (fetch+normaliza), pinta e regrava o snapshot. Boot (se
        // snapshot ausente/velho) e botão "atualizar".
        const recarregar = React.useCallback(() => {
          return FD.integrations.carregar((p) => { if (vivoRef.current) setTodas(p); })
            .then((esc) => { if (vivoRef.current) { setTodas(esc); setSnapEm(FD.NOW.toISOString()); } if (FD.snapshotStore) FD.snapshotStore.gravar(esc); })
            .catch((err) => { console.error(err); if (vivoRef.current) setTodas([]); });
        }, []);
        // BOOT read-model: lê o snapshot do Supabase -> render INSTANTÂNEO (re-avalia a
        // criticidade contra FD.NOW pois ela é congelada no load) -> stale-while-revalidate
        // (recarrega ao vivo se velho). Qualquer falha do snapshot cai no fluxo ao vivo.
        useEffect(() => {
          vivoRef.current = true;
          (async () => {
            let snap = null;
            try { snap = FD.snapshotStore ? await FD.snapshotStore.ler() : null; } catch (e) { snap = null; }
            if (snap && snap.escolas && snap.escolas.length) {
              try {
                if (vivoRef.current) { setTodas(FD.engine.avaliarTodas(snap.escolas)); setSnapEm(snap.capturadoEm); }
                if (FD.snapshotStore.staleMs(snap.capturadoEm) > 6 * 60 * 60 * 1000) recarregar();
              } catch (e) { recarregar(); }
            } else { recarregar(); }
          })();
          return () => { vivoRef.current = false; };
        }, [recarregar]);
        // Estado compartilhado por cliente (Supabase): carrega no cache e re-renderiza quando
        // chega/muda ao vivo. As leituras seguem SÍNCRONAS do cache (render inalterado).
        useEffect(() => {
          const un = (FD.clienteStore.subscribe && FD.clienteStore.subscribe(() => setTick((t) => t + 1))) || null;
          if (FD.clienteStore.init) FD.clienteStore.init();
          return () => { if (un) un(); };
        }, []);
        // sobe ao topo ao trocar de view/cliente. Ao ABRIR um cliente (navDir "in"),
        // o scroll é instantâneo p/ não competir com o slide de entrada (fd-push-in);
        // nas trocas de aba mantém o suave. (respeita reduced-motion via 'auto')
        useEffect(() => {
          if (window.scrollY < 8) return;
          const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          window.scrollTo({ top: 0, behavior: (reduce || navDir === "in") ? "auto" : "smooth" });
        }, [view, selId]);

        const diretoria = sessao && sessao.papel === "diretoria";
        // visiveis = carteira do escopo (squad) SEM busca -> alimenta o DETALHE.
        // escolas = visiveis + filtro de busca -> alimenta as LISTAS. Assim digitar
        // na busca não derruba o cliente aberto no detalhe.
        const visiveis = useMemo(() => {
          if (!todas || !sessao) return [];
          let base = todas.filter((e) => sessao.squads.includes(e.squad));
          if (diretoria && squad !== "todos") base = base.filter((e) => e.squad === squad);
          return base;
        }, [todas, sessao, squad, diretoria]);
        const escolas = useMemo(() => {
          const q = norm(busca);
          return q ? visiveis.filter((e) => norm(e.nome).indexOf(q) >= 0) : visiveis;
        }, [visiveis, busca]);
        // Escopo de squads da tela (respeita o filtro da diretoria) — usado por LTV/Out.
        const escopoSquads = useMemo(() => {
          if (!sessao) return [];
          if (diretoria) return squad === "todos" ? ["azul", "laranja"] : [squad];
          return sessao.squads;
        }, [sessao, diretoria, squad]);
        const escolasOut = useMemo(() => (todas && FD.integrations.clientesOut) ? FD.integrations.clientesOut(escopoSquads) : [], [todas, escopoSquads]);
        const ltvInfo = useMemo(() => (todas && FD.integrations.ltvResumo) ? FD.integrations.ltvResumo(escopoSquads) : null, [todas, escopoSquads]);
        const outVis = useMemo(() => { const q = norm(busca); return q ? escolasOut.filter((e) => norm(e.nome).indexOf(q) >= 0) : escolasOut; }, [escolasOut, busca]);

        // Filtro por pessoa: busca SOB DEMANDA todas as tarefas do responsável
        // (qualquer lista, filtrado por ID no ClickUp). Rápido e completo.
        useEffect(() => {
          if (!resp || !sessao || REP_ID[resp] == null) { setRespTasks(null); setRespLoading(false); return; }
          let vivo = true;
          setRespLoading(true); setRespTasks(null);
          // Só busca nos squads em que a pessoa ATUA, dentro do escopo atual da tela.
          // Ex.: Caio (nos dois) filtrado em Laranja -> só Laranja; João/Jon nunca puxam do Azul.
          const escopo = diretoria ? (squad === "todos" ? ["azul", "laranja"] : [squad]) : (sessao.squads || []);
          const alvos = squadsDoResp(resp).filter((sq) => escopo.indexOf(sq) >= 0);
          FD.integrations.clickup.tarefasPorResponsavel(alvos, REP_ID[resp])
            .then((t) => { if (vivo) { setRespTasks(t); setRespLoading(false); } })
            .catch(() => { if (vivo) { setRespTasks([]); setRespLoading(false); } });
          return () => { vivo = false; };
        }, [resp, sessao, todas, squad, diretoria]);

        const repsDisp = useMemo(() => {
          const sqs = diretoria ? (squad === "todos" ? ["azul", "laranja"] : [squad]) : (sessao ? sessao.squads : []);
          const out = [];
          sqs.forEach((sq) => (REPRESENTANTES[sq] || []).forEach((r) => { if (out.indexOf(r.nome) < 0) out.push(r.nome); }));
          return out;
        }, [diretoria, squad, sessao]);
        // limpa o responsável selecionado se ele sair da lista (ex.: trocou de squad)
        useEffect(() => { if (resp && repsDisp.indexOf(resp) < 0) setResp(null); }, [repsDisp, resp]);
        // glow inferior segue o squad: laranja no Laranja, azul no Azul, preto na diretoria/consolidado
        useEffect(() => {
          const sq = diretoria ? squad : (sessao && sessao.squad);
          const cor = sq === "laranja" ? "#5a300c" : sq === "azul" ? "#1a3a78" : "rgba(0,0,0,.5)";
          document.documentElement.style.setProperty("--fd-glow2", cor);
        }, [diretoria, squad, sessao]);

        const agenda = useMemo(
          () => (todas && sessao && FD.integrations.agenda) ? FD.integrations.agenda(sessao.squads, 7) : [],
          [todas, sessao]
        );

        const abrirCliente = (id) => { setNavDir("in"); setBackView(view); setSelId(id); setView("detalhe"); };
        const voltar = React.useCallback(() => { setNavDir("out"); setView(backView); }, [backView]); // estável -> ClienteDetailMemo pula re-render
        const resetUI = () => { setNavDir(""); setSelId(null); setBackView("clientes"); setBusca(""); setResp(null); setRespTasks(null); setRespLoading(false); };
        const logout = () => { FD.auth.logout(); resetUI(); setSessao(null); setView("resumo"); setSquad("todos"); };

        if (!sessao) return <Login onLogin={(s) => { resetUI(); setSessao(s); setSquad("todos"); setView("resumo"); }} />;
        if (!todas) {
          const Sk = ({ className = "" }) => <div className={`fd-skel rounded-2xl ${className}`} />;
          return (
            <div className="min-h-screen pb-12" aria-busy="true" aria-label="Carregando operação">
              <div className="h-[57px] border-b border-slate-800 bg-slate-950/60" />
              <div className="max-w-6xl mx-auto px-4 py-5 space-y-5">
                <Sk className="h-28" />
                <div className="grid grid-cols-3 gap-3"><Sk className="h-20" /><Sk className="h-20" /><Sk className="h-20" /></div>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5"><Sk className="h-72" /><Sk className="h-72" /></div>
                <Sk className="h-64" />
              </div>
            </div>
          );
        }

        const showSquad = diretoria;
        const label = diretoria ? (squad === "todos" ? "consolidado" : SQUADS[squad].nome) : sessao.nome;
        const selecionada = visiveis.find((e) => e.id === selId) || escolasOut.find((e) => e.id === selId);

        return (
          <div className="min-h-screen pb-12">
            <Header sessao={sessao} squad={squad} setSquad={setSquad} view={view} setView={(v) => { setNavDir(""); setView(v); }} onLogout={logout} busca={busca} setBusca={setBusca} resp={resp} setResp={(r) => { setResp(r); if (r) setView("demandas"); }} reps={repsDisp} />
            {snapEm && FD.snapshotStore && FD.snapshotStore.staleMs(snapEm) > 60000 && (
              <div className="max-w-6xl mx-auto px-4 pt-2 -mb-1 text-[11px] text-slate-500 flex items-center gap-2">
                <span title="Lido do Supabase (cache) — não bateu nas APIs">📦 dados de {relativo(snapEm)}</span>
                <button onClick={recarregar} className="text-blue-400 hover:underline font-medium">🔄 atualizar agora</button>
              </div>
            )}
            <main className="max-w-6xl mx-auto px-4 py-5">
            <div key={view + "·" + squad + (view === "detalhe" ? selId : "")} className={view === "detalhe" ? "fd-push-in" : navDir === "out" ? "fd-push-out" : "fd-fade"}>
              {view === "resumo" && <Resumo escolas={escolas} label={label} showSquad={showSquad} abrirCliente={abrirCliente} setView={setView} agenda={agenda} />}
              {view === "renovacoes" && <Renovacoes escolas={escolas} showSquad={showSquad} abrirCliente={abrirCliente} />}
              {view === "reunioes" && <Reunioes escolas={escolas} showSquad={showSquad} abrirCliente={abrirCliente} />}
              {view === "nps" && <NpsView escolas={escolas} showSquad={showSquad} abrirCliente={abrirCliente} />}
              {view === "demandas" && <Demandas escolas={escolas} showSquad={showSquad} abrirCliente={abrirCliente} resp={resp} setResp={setResp} reps={repsDisp} respTasks={respTasks} respLoading={respLoading} />}
              {view === "clientes" && <Clientes escolas={escolas} showSquad={showSquad} abrirCliente={abrirCliente} />}
              {view === "evolucao" && <EvolucaoView escolas={escolas} sessao={sessao} squad={squad} showSquad={showSquad} abrirCliente={abrirCliente} />}
              {view === "out" && <ClientesOut escolasOut={outVis} ltv={ltvInfo} abrirCliente={abrirCliente} />}
              {view === "integracoes" && <Integracoes squads={sessao.squads} onSaved={() => setTick((t) => t + 1)} />}
              {view === "detalhe" && (selecionada
                ? <ClienteDetailMemo escola={selecionada} voltar={voltar} />
                : <div className={`${CARD} p-6 text-center`}><p className="text-slate-300 text-sm">Cliente fora da carteira atual.</p><button onClick={() => { setSelId(null); setView("clientes"); }} className="mt-3 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-xl px-4 py-2">Voltar para clientes</button></div>)}
            </div>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <script>
      window.addEventListener("load", function () {
        try {
          if (!window.Babel) { fdErro("Babel não carregou (CDN bloqueado/sem internet?)."); return; }
          var src = document.getElementById("app-src").textContent;
          var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]], filename: "app.jsx" }).code;
          new Function(out)();
          clearTimeout(window.__fdTimer); // app renderizou: cancela o watchdog de erro
        } catch (err) { console.error(err); fdErro((err && err.message ? err.message : String(err)) + (err && err.stack ? "\n\n" + err.stack.split("\n").slice(0, 4).join("\n") : "")); }
      });
    </script>
  </body>
</html>
