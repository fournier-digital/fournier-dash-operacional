    <script type="text/app-jsx" id="app-src">
      const { useState, useEffect, useMemo } = React;
      const FD = window.FD;
      const { dataCurta, relativo, diasAte, diasDesde, SQUADS } = FD.lib;
      const norm = FD.lib.norm;

      // Representantes por squad — com o ID FIXO do ClickUp (designação precisa).
      const REPRESENTANTES = {
        laranja: [
          { nome: "Caio Siqueira", id: 94202358 },
          { nome: "João Gabriel", id: 88380770 },
          { nome: "Jon", id: 210282722 },
        ],
        azul: [
          { nome: "Caio Siqueira", id: 94202358 },
          { nome: "Cauã Dantas", id: 236485671 },
          { nome: "Bruno Lopes", id: 88380772 },
        ],
      };
      const REP_ID = {};
      Object.keys(REPRESENTANTES).forEach((sq) => REPRESENTANTES[sq].forEach((r) => { REP_ID[r.nome] = r.id; }));
      // Todos os nomes de representantes (união dos squads) e a quais squads cada um pertence.
      const TODOS_REPS = Object.keys(REPRESENTANTES).reduce((acc, sq) => { REPRESENTANTES[sq].forEach((r) => { if (acc.indexOf(r.nome) < 0) acc.push(r.nome); }); return acc; }, []);
      const squadsDoResp = (nome) => Object.keys(REPRESENTANTES).filter((sq) => REPRESENTANTES[sq].some((r) => r.nome === nome));

      // Casa a demanda com o representante: primeiro pelo ID do ClickUp (preciso);
      // se não houver IDs (ex.: mock), cai no match por nome tolerante.
      function matchResp(demanda, repNome) {
        const id = REP_ID[repNome];
        if (id != null && demanda.responsaveisIds && demanda.responsaveisIds.length) {
          return demanda.responsaveisIds.some((x) => Number(x) === Number(id));
        }
        const alvo = norm(repNome);
        if (!alvo) return false;
        const nomes = (demanda.responsaveis && demanda.responsaveis.length)
          ? demanda.responsaveis : [demanda.responsavel];
        const bt = alvo.split(" ").filter(Boolean);
        return nomes.some((n) => {
          const a = norm(n);
          if (!a) return false;
          if (a === alvo) return true;
          const at = a.split(" ").filter(Boolean);
          const aset = new Set(at), bset = new Set(bt);
          return bt.every((t) => aset.has(t)) || at.every((t) => bset.has(t));
        });
      }

      // Seletor de responsável (pop-up no topo).
      function RepSelector({ reps, resp, setResp }) {
        const [open, setOpen] = useState(false);
        const ref = React.useRef(null);
        // fecha ao clicar fora ou apertar Esc (só enquanto aberto)
        useEffect(() => {
          if (!open) return;
          const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
          const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
          document.addEventListener("mousedown", onDoc);
          document.addEventListener("keydown", onKey);
          return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
        }, [open]);
        if (!reps || !reps.length) return null;
        return (
          <div className="relative" ref={ref}>
            <button onClick={() => setOpen((o) => !o)} aria-haspopup="menu" aria-expanded={open} className={`text-[12px] font-semibold rounded-xl px-2.5 min-h-[40px] inline-flex items-center gap-1 ${resp ? "bg-blue-600 text-white" : "bg-slate-800/80 text-slate-300 hover:text-slate-100"}`}>
              <span aria-hidden="true">👤</span><span className="max-w-[110px] truncate">{resp || "Responsável"}</span><span className="text-[10px]" aria-hidden="true">▾</span>
            </button>
            {open && (
              <div role="menu" className="fd-pop absolute right-0 mt-1 z-30 w-52 rounded-xl border border-slate-700 bg-slate-900 shadow-xl p-1">
                <button role="menuitem" onClick={() => { setResp(null); setOpen(false); }} className={`w-full text-left text-[13px] rounded-lg px-2.5 py-1.5 ${!resp ? "bg-slate-700 text-white" : "text-slate-300 hover:bg-slate-800"}`}>Todos os responsáveis</button>
                {reps.map((r) => <button key={r} role="menuitem" onClick={() => { setResp(r); setOpen(false); }} className={`w-full text-left text-[13px] rounded-lg px-2.5 py-1.5 ${resp === r ? "bg-blue-600 text-white" : "text-slate-300 hover:bg-slate-800"}`}>{r}</button>)}
              </div>
            )}
          </div>
        );
      }

      const SQ_TXT = { azul: "#93c5fd", laranja: "#fdba74" };
      const HOJE_LONGA = FD.NOW.toLocaleDateString("pt-BR", { day: "2-digit", month: "long" }); // FD.NOW é imutável por sessão
      const NIVEL = {
        vermelho: { dot: "#ff3b5c", chip: "bg-rose-500/20 text-rose-300", label: "Muito crítico" },
        laranja: { dot: "#ff7a1a", chip: "bg-orange-500/20 text-orange-300", label: "Crítico" },
        amarelo: { dot: "#ffc73a", chip: "bg-amber-400/20 text-amber-200", label: "Atenção" },
        verde: { dot: "#19e57f", chip: "bg-emerald-500/20 text-emerald-300", label: "Saudável" },
      };
      const CARD = "bg-slate-900/70 border border-slate-800 rounded-2xl";
      const ROW_HOVER = "transition-colors duration-150 hover:bg-slate-800/60 active:bg-slate-700/60";
      const H = "font-bold text-slate-100 tracking-tight";
      const renovTxt = (d) => (d == null ? "—" : d < 0 ? `vencida ${-d}d` : d === 0 ? "vence hoje" : `em ${d}d`);
      const mesesAtivo = (e) => Math.max(1, Math.round(diasDesde(e.inicioContrato) / 30));
      const mesesAtivoTxt = (e) => { const m = mesesAtivo(e); return `${m} ${m === 1 ? "mês" : "meses"}`; };
      // Exceções "fora do padrão" (onboarding/entregáveis com observação, ex.: Onis "Não fazemos os criativos")
      const excecoesDe = (e) => [].concat(e.onboarding || [], e.entregaveis || []).filter((i) => i.excecao && i.status);
      const temExcecao = (e) => excecoesDe(e).length > 0;
      // Cor por NPS (nota 0–10): promotor 7+ · neutro 6 · insatisfeito 5 · crítico <5
      const corNps = (v) => (v == null ? "slate" : v >= 7 ? "green" : v >= 6 ? "amber" : v >= 5 ? "orange" : "red");
      const npsDisp = (v) => (v == null ? null : Math.round((Number(v) / 2) * 10) / 10); // 0–10 interno -> EXIBIÇÃO 1–5
      // Cor do status de entregável/demanda: Marcado (âmbar) -> Enviado (azul) -> Feito (verde) -> vazio (cinza).
      const corDem = (it) => {
        const v = norm((it && it.status) || "");
        if (/feito|conclu|aprovad|complet|ativ/.test(v)) return { cls: "bg-emerald-500/15 text-emerald-300", ic: "✓" };
        if (/enviad/.test(v)) return { cls: "bg-blue-500/15 text-blue-300", ic: "↑" };
        if (/marcad|agendad/.test(v)) return { cls: "bg-amber-500/15 text-amber-300", ic: "•" };
        if (v) return { cls: "bg-slate-700/50 text-slate-300", ic: "•" };          // outro status com texto
        return (it && it.feito) ? { cls: "bg-emerald-500/15 text-emerald-300", ic: "✓" } : { cls: "bg-slate-800 text-slate-500", ic: "·" };
      };
      const NPS_TXT = { green: "text-emerald-300", amber: "text-amber-300", orange: "text-orange-300", red: "text-rose-300", slate: "text-slate-400" };
      const NPS_DOT = { green: "bg-emerald-500", amber: "bg-amber-400", orange: "bg-orange-500", red: "bg-rose-500", slate: "bg-slate-600" };
      const NPS_LABEL = { green: "promotor", amber: "neutro", orange: "insatisfeito", red: "crítico", slate: "—" };
      // Barra/texto de status das listas (Renovações + Reuniões) — antes duplicados nos 2 componentes.
      const STATUS_BARRA = { tentativa: "bg-violet-500", blue: "bg-blue-500", green: "bg-emerald-500", amber: "bg-amber-400", orange: "bg-orange-500", red: "bg-red-500", slate: "bg-slate-700" };
      const STATUS_TXT = { tentativa: "text-violet-300", blue: "text-blue-300", green: "text-emerald-300", amber: "text-amber-300", orange: "text-orange-300", red: "text-red-300", slate: "text-slate-400" };
      // Tom dos números de KPI/Tile — antes duplicado em KpiMini e Tile.
      const TONE_TXT = { red: "text-red-400", amber: "text-amber-400", orange: "text-orange-400", green: "text-emerald-400", blue: "text-blue-300", slate: "text-slate-100" };

      function Semaforo({ nivel, size = 10 }) {
        return <span className="inline-block rounded-full shrink-0 transition-transform duration-150 group-hover:scale-125" style={{ width: size, height: size, backgroundColor: NIVEL[nivel].dot, boxShadow: `0 0 4px ${NIVEL[nivel].dot}cc, 0 0 0 1.5px ${NIVEL[nivel].dot}55` }} title={NIVEL[nivel].label} />;
      }
      // Item de legenda (bolinha + contagem) — em escopo de módulo p/ o React reconciliar
      // no lugar (definido dentro do componente vira um TIPO novo a cada render -> remount).
      const Legend = ({ color, n, t }) => <span className="flex items-center gap-1.5"><span className={`w-2 h-2 rounded-full ${color}`} />{n} {t}</span>;
      // Legenda de cores que também FILTRA: clica numa cor -> mostra só aquela; clica de novo -> todos.
      function FiltroCores({ itens, ativo, onToggle }) {
        return (
          <div role="group" aria-label="Filtrar por cor" className="px-4 py-2 border-b border-slate-800/60 flex flex-wrap items-center gap-1.5 text-[10px]">
            {itens.map((it) => {
              const on = ativo === it.cor;
              const vazio = it.n === 0; // cor sem clientes: vira só legenda (não filtra)
              return (
                <button key={it.cor} disabled={vazio} aria-pressed={on} onClick={() => onToggle(it.cor)} title={vazio ? "Sem clientes nesta cor" : "Filtrar por esta cor"} className={`inline-flex items-center gap-1 rounded-full px-2 py-0.5 border transition active:scale-95 ${vazio ? "border-transparent text-slate-600 cursor-default" : on ? "border-slate-400 bg-slate-700/70 text-slate-100" : "border-slate-700/40 text-slate-500 hover:text-slate-200 hover:border-slate-600"}`}>
                  <span className={`w-2 h-2 rounded-full ${it.dot} ${vazio ? "opacity-40" : ""}`} />{it.label}{it.n != null ? ` · ${it.n}` : ""}
                </button>
              );
            })}
            {ativo && <button onClick={() => onToggle(ativo)} className="text-slate-500 hover:text-slate-200 ml-1 underline">limpar</button>}
          </div>
        );
      }
      function SquadBadge({ squad, small }) {
        const s = SQUADS[squad];
        return <span className={`inline-flex items-center gap-1.5 ${small ? "text-[11px] px-1.5 py-0.5" : "text-xs px-2 py-0.5"} rounded-md font-semibold`} style={{ backgroundColor: s.cor + "22", color: SQ_TXT[squad], border: `1px solid ${s.cor}44` }}><span className="inline-block w-1.5 h-1.5 rounded-full" style={{ backgroundColor: s.cor }} />{s.nome.replace("Squad ", "")}</span>;
      }
      function NpsChip({ label, valor }) {
        if (valor == null) return <span className="text-[10px] px-1.5 py-0.5 rounded font-semibold bg-slate-800 text-slate-500">{label} —</span>;
        const ruim = valor < 7;
        return <span className={`text-[10px] px-1.5 py-0.5 rounded font-semibold transition-colors duration-150 ${ruim ? "bg-red-500/15 text-red-300" : "bg-emerald-500/15 text-emerald-300"}`}>{label} {npsDisp(valor)}</span>;
      }
      function ChanceBar({ pct, nivel }) {
        const cor = { verde: "bg-emerald-500", amarelo: "bg-amber-400", vermelho: "bg-red-500" }[nivel];
        const txt = { verde: "text-emerald-300", amarelo: "text-amber-300", vermelho: "text-red-300" }[nivel];
        return <div className="flex items-center gap-2 w-28 shrink-0"><div className="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden"><div className={`h-full ${cor} rounded-full fd-grow transition-[width] duration-700 ease-out`} style={{ width: pct + "%" }} /></div><span className={`text-[12px] font-bold ${txt} w-9 text-right`}>{pct}%</span></div>;
      }
      function Chevron() { return <span className="text-slate-500 group-hover:text-blue-300 group-hover:translate-x-0.5 motion-reduce:transform-none transition-[color,transform] duration-150 text-xl shrink-0 leading-none">›</span>; }
      function Sparkline({ serie, color }) {
        const n = serie.length;
        const pts = serie.map((v, i) => (v == null ? null : `${(i / (n - 1)) * 100},${28 - (v / 10) * 24}`)).filter(Boolean);
        if (pts.length < 2) {
          const ultimo = serie.filter((v) => v != null).pop();
          return ultimo == null
            ? <div className="text-[11px] text-slate-400">sem dados</div>
            : <div className="text-2xl font-extrabold py-1" style={{ color }}>{npsDisp(ultimo)}<span className="text-[11px] text-slate-500 font-normal"> · 1 mês</span></div>;
        }
        const lastIdx = serie.reduce((acc, v, i) => (v != null ? i : acc), -1);
        const last = serie[lastIdx];
        return (
          <svg viewBox="0 0 100 30" preserveAspectRatio="none" className="w-full h-9">
            <polyline pathLength="1" points={pts.join(" ")} fill="none" stroke={color} strokeWidth="2.5" vectorEffect="non-scaling-stroke" strokeLinejoin="round" strokeLinecap="round" className="fd-spark" />
            <circle className="fd-spark-dot" cx={(lastIdx / (n - 1)) * 100} cy={28 - (last / 10) * 24} r="2.6" fill={color} />
          </svg>
        );
      }

      // normaliza uma série p/ 0–10 só p/ desenhar a FORMA no Sparkline (escalas diferentes)
      const norm10 = (arr) => {
        const v = arr.filter((x) => x != null);
        if (v.length < 2) return arr;
        const mn = Math.min.apply(null, v), mx = Math.max.apply(null, v);
        if (mx === mn) return arr.map((x) => (x == null ? null : 5));
        return arr.map((x) => (x == null ? null : ((x - mn) / (mx - mn)) * 10));
      };
      // ── Fase 3 · Evolução cronológica de UM cliente (lê cliente_snapshot por dia) ──
      function EvolucaoCliente({ nome }) {
        const [hist, setHist] = useState(null);
        useEffect(() => {
          let vivo = true;
          if (FD.snapshotStore) FD.snapshotStore.historico(nome).then((h) => { if (vivo) setHist(h || []); }).catch(() => { if (vivo) setHist([]); });
          else setHist([]);
          return () => { vivo = false; };
        }, [nome]);
        if (hist == null) return <div className={`${CARD} p-4 text-sm text-slate-400`}>Carregando evolução…</div>;
        if (hist.length < 2) return (
          <div className={`${CARD} p-4`}>
            <div className={H}>📈 Evolução</div>
            <p className="text-[13px] text-slate-400 mt-1">Ainda coletando histórico — {hist.length} {hist.length === 1 ? "captura" : "capturas"}. A linha do tempo aparece com 2+ dias de dados.</p>
          </div>
        );
        const col = (k) => hist.map((r) => (r[k] == null ? null : Number(r[k])));
        const linha = (titulo, serie, cor, fmt, maiorPior) => {
          const vals = serie.filter((v) => v != null);
          const atual = vals.length ? vals[vals.length - 1] : null;
          const base = vals.length > 1 ? vals[0] : null;
          const d = atual != null && base != null ? atual - base : null;
          const pior = d != null && d !== 0 && (maiorPior ? d > 0 : d < 0);
          const cd = d == null || d === 0 ? "text-slate-500" : pior ? "text-red-400" : "text-emerald-400";
          const seta = d == null ? "" : d > 0 ? "▲" : d < 0 ? "▼" : "▬";
          return (
            <div>
              <div className="flex items-baseline justify-between mb-0.5">
                <span className="text-[12px] text-slate-400">{titulo}</span>
                <span className="text-sm font-bold text-slate-100">{atual == null ? "—" : fmt(atual)} <span className={`text-[11px] font-semibold ${cd}`}>{seta}{d ? fmt(Math.abs(d)) : ""}</span></span>
              </div>
              {vals.length >= 2 ? <Sparkline serie={norm10(serie)} color={cor} /> : <div className="h-9 flex items-center text-[11px] text-slate-500">sem série</div>}
            </div>
          );
        };
        return (
          <div className={CARD}>
            <div className="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
              <span className={H}>📈 Evolução</span>
              <span className="text-[11px] text-slate-500">{hist.length} capturas · {FD.lib.dataCurta(hist[0].dia)} → {FD.lib.dataCurta(hist[hist.length - 1].dia)}</span>
            </div>
            <div className="p-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
              {linha("Score de risco", col("score"), "#f87171", (v) => v.toFixed(1), true)}
              {linha("NPS externo", col("nps_externo"), "#34d399", (v) => v.toFixed(1), false)}
              {linha("Chance de renovar", col("chance_renovar"), "#60a5fa", (v) => Math.round(v) + "%", false)}
              {linha("Demandas atrasadas", col("atrasadas"), "#fbbf24", (v) => String(Math.round(v)), true)}
            </div>
          </div>
        );
      }

      // ── Fases 4 e 5 · Tendências da carteira + insights mensais por squad ──
      const MESES_PT = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
      const mesLabel = (m) => { const p = String(m).split("-"); return `${MESES_PT[(+p[1] || 1) - 1]}/${(p[0] || "").slice(2)}`; };
      function MensalBloco({ mensal, escopo, showSquad }) {
        if (mensal == null) return <div className={`${CARD} p-6 text-sm text-slate-400`}>Carregando histórico mensal…</div>;
        const squads = escopo.filter((s) => (mensal[s] || []).length);
        if (!squads.length) return <div className={`${CARD} p-6 text-sm text-slate-500`}>📅 Sem histórico mensal ainda — os insights por mês aparecem conforme os snapshots acumulam (NPS mensal, atrasos e críticos por mês).</div>;
        const badge = (cur, prev, maiorPior, fmt) => {
          if (prev == null || cur == null) return null;
          const d = cur - prev;
          if (Math.abs(d) < 0.05) return <span className="text-slate-500 text-[10px] ml-1">▬</span>;
          const pior = maiorPior ? d > 0 : d < 0;
          return <span className={`text-[10px] ml-1 ${pior ? "text-red-400" : "text-emerald-400"}`}>{d > 0 ? "▲" : "▼"}{fmt(Math.abs(d))}</span>;
        };
        return (
          <div className="space-y-5">
            {squads.map((s) => {
              const linhas = mensal[s];
              const cor = s === "azul" ? "text-blue-300" : s === "laranja" ? "text-orange-300" : "text-slate-200";
              return (
                <div key={s} className={CARD}>
                  <div className="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                    <span className={H}>📅 Evolução mensal {showSquad && <span className={`text-[11px] font-bold ml-1 ${cor}`}>· {s}</span>}</span>
                    <span className="text-[11px] text-slate-500">{linhas.length} {linhas.length === 1 ? "mês" : "meses"}</span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-[12px]">
                      <thead><tr className="text-slate-500 text-left border-b border-slate-800">
                        <th className="px-3 py-2 font-semibold">Mês</th><th className="px-3 py-2 font-semibold text-right">Clientes</th>
                        <th className="px-3 py-2 font-semibold text-right">Score méd.</th><th className="px-3 py-2 font-semibold text-right">NPS méd.</th>
                        <th className="px-3 py-2 font-semibold text-right">Chance méd.</th><th className="px-3 py-2 font-semibold text-right">Críticos</th>
                        <th className="px-3 py-2 font-semibold text-right">Atrasos</th>
                      </tr></thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {linhas.map((r, i) => { const p = i > 0 ? linhas[i - 1] : null; return (
                          <tr key={r.mes} className="text-slate-200">
                            <td className="px-3 py-2 font-semibold text-slate-100">{mesLabel(r.mes)}</td>
                            <td className="px-3 py-2 text-right">{r.nClientes}</td>
                            <td className="px-3 py-2 text-right">{r.avgScore}{badge(r.avgScore, p && p.avgScore, true, (x) => x.toFixed(1))}</td>
                            <td className="px-3 py-2 text-right">{r.avgNps == null ? "—" : r.avgNps}{r.avgNps != null && badge(r.avgNps, p && p.avgNps, false, (x) => x.toFixed(1))}</td>
                            <td className="px-3 py-2 text-right">{r.avgChance}%{badge(r.avgChance, p && p.avgChance, false, (x) => Math.round(x))}</td>
                            <td className="px-3 py-2 text-right">{r.nCritico}{badge(r.nCritico, p && p.nCritico, true, (x) => Math.round(x))}</td>
                            <td className="px-3 py-2 text-right">{r.atrasos}{badge(r.atrasos, p && p.atrasos, true, (x) => Math.round(x))}</td>
                          </tr>
                        ); })}
                      </tbody>
                    </table>
                  </div>
                </div>
              );
            })}
          </div>
        );
      }
      function EvolucaoView({ escolas, sessao, squad, showSquad, abrirCliente }) {
        const [tend, setTend] = useState(null);
        const [mensal, setMensal] = useState(null);
        useEffect(() => {
          let vivo = true;
          if (FD.snapshotStore) {
            FD.snapshotStore.tendenciasCarteira(30).then((t) => { if (vivo) setTend(t || []); }).catch(() => { if (vivo) setTend([]); });
            FD.snapshotStore.mensalPorSquad(12).then((m) => { if (vivo) setMensal(m || {}); }).catch(() => { if (vivo) setMensal({}); });
          } else { setTend([]); setMensal({}); }
          return () => { vivo = false; };
        }, []);
        const escopo = sessao.papel === "diretoria" && squad !== "todos" ? [squad] : sessao.squads;
        const nomeDe = {}, idDe = {};
        for (const e of escolas) { const c = FD.lib.norm(e.nome); nomeDe[c] = e.nome; idDe[c] = e.id; }
        const noEscopo = (tend || []).filter((t) => escopo.includes(t.squad));
        const piora = noEscopo.filter((t) => t.piorando);
        const melhora = noEscopo.filter((t) => t.melhorando);
        const estaveis = Math.max(0, noEscopo.length - piora.length - melhora.length);
        const rowTend = (t, cor) => {
          const nm = nomeDe[t.canon] || t.canon;
          const id = idDe[t.canon];
          const txt = (t.piorando ? t.motivos : t.bons).join(" · ");
          const inner = (
            <div className="flex items-start justify-between gap-3 px-4 py-2.5">
              <div className="min-w-0">
                <div className="text-sm font-semibold text-slate-100 truncate">{nm}{showSquad && <span className="text-[10px] text-slate-500 ml-1.5">{t.squad}</span>}</div>
                <div className={`text-[12px] ${cor}`}>{txt || "—"}</div>
              </div>
              <span className="text-[11px] text-slate-500 shrink-0">{FD.lib.dataCurta(t.de)}→{FD.lib.dataCurta(t.ate)}</span>
            </div>
          );
          return id ? <button key={t.canon} onClick={() => abrirCliente(id)} className={`w-full text-left ${ROW_HOVER}`}>{inner}</button> : <div key={t.canon}>{inner}</div>;
        };
        return (
          <div className="space-y-5">
            <div className={CARD}>
              <div className="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                <span className={H}>📉 Tendências <span className="text-[11px] text-slate-500 font-normal">· últimos 30 dias</span></span>
                {tend && <span className="text-[11px] text-slate-500">{piora.length} piorando · {melhora.length} melhorando · {estaveis} estáveis</span>}
              </div>
              {tend == null ? <div className="px-4 py-6 text-sm text-slate-400">Carregando tendências…</div>
                : noEscopo.length === 0 ? <div className="px-4 py-6 text-sm text-slate-500">Ainda sem histórico suficiente. As tendências aparecem quando houver 2+ dias de captura por cliente (o histórico acumula a cada carga ao vivo).</div>
                : <div className="divide-y divide-slate-800">
                    {piora.length > 0 && <div className="px-4 pt-2 pb-1 text-[11px] font-bold uppercase tracking-wide text-red-400/80">Piorando</div>}
                    {piora.map((t) => rowTend(t, "text-red-400"))}
                    {melhora.length > 0 && <div className="px-4 pt-2 pb-1 text-[11px] font-bold uppercase tracking-wide text-emerald-400/80">Melhorando</div>}
                    {melhora.map((t) => rowTend(t, "text-emerald-400"))}
                    {piora.length === 0 && melhora.length === 0 && <div className="px-4 py-4 text-sm text-slate-500">Nenhuma variação relevante no período — carteira estável 👌</div>}
                  </div>}
            </div>
            <MensalBloco mensal={mensal} escopo={escopo} showSquad={showSquad} />
          </div>
        );
      }

      // KPI clicável — leva à aba já priorizada
      function KpiMini({ label, value, sub, tone = "slate", onClick }) {
        const t = TONE_TXT[tone] || "text-slate-100";
        return (
          <button onClick={onClick} className={`group ${CARD} px-2.5 sm:px-4 py-3 sm:py-3.5 text-left transition ${onClick ? "hover:border-slate-600 hover:bg-slate-800/40 active:scale-[.98]" : "cursor-default"}`}>
            <div className="flex items-center justify-between gap-1"><div className="text-[10px] sm:text-[11px] uppercase tracking-wider text-slate-400 font-semibold">{label}</div>{onClick && <span className="hidden sm:inline text-slate-500 group-hover:text-blue-300 transition">›</span>}</div>
            <div className={`text-2xl sm:text-[28px] leading-none font-extrabold mt-1.5 fd-neon ${t}`}>{value}</div>
            {sub && <div className="text-[11px] text-slate-400 mt-1.5">{sub}</div>}
          </button>
        );
      }

      /* ---------------- LOGIN ---------------- */
      function Login({ onLogin }) {
        const [perfil, setPerfil] = useState("diretoria");
        const [senha, setSenha] = useState("");
        const [erro, setErro] = useState("");
        const entrar = () => { const r = FD.auth.login(perfil, senha); if (!r.ok) { setErro(r.erro); return; } onLogin(r.sessao); };
        return (
          <div className="min-h-screen grid place-items-center px-4">
            <div className={`w-full max-w-sm ${CARD} p-7 shadow-2xl shadow-black/40`}>
              <div className="flex items-center gap-2.5 mb-6"><div className="w-9 h-9 rounded-xl bg-blue-600 text-white grid place-items-center font-extrabold">F</div><div><div className={`${H} leading-tight`}>Fournier · Operação</div><div className="text-[12px] text-slate-400">Painel interno por squad</div></div></div>
              <div className="text-[12px] font-semibold text-slate-400 mb-1.5">Perfil de acesso</div>
              <div className="grid grid-cols-3 gap-1.5 mb-4">
                {FD.auth.perfis.map((p) => { const active = perfil === p.id; const c = p.id === "azul" ? "border-blue-500 text-blue-300 bg-blue-500/10" : p.id === "laranja" ? "border-orange-500 text-orange-300 bg-orange-500/10" : "border-slate-400 text-slate-100 bg-slate-700/60"; return <button key={p.id} onClick={() => { setPerfil(p.id); setErro(""); }} className={`text-[12px] font-semibold rounded-xl border px-2 py-2.5 transition ${active ? c : "border-slate-700 text-slate-400 hover:border-slate-600"}`}>{p.label}</button>; })}
              </div>
              <label className="block"><span className="text-[12px] font-semibold text-slate-400">Senha</span><input type="password" value={senha} autoFocus onChange={(e) => { setSenha(e.target.value); setErro(""); }} onKeyDown={(e) => e.key === "Enter" && entrar()} placeholder="••••••••" className="mt-1.5 w-full text-sm bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500" /></label>
              {erro && <div className="text-[12px] text-red-400 mt-2">{erro}</div>}
              <button onClick={entrar} className="mt-5 w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-xl py-2.5 transition">Entrar</button>
            </div>
          </div>
        );
      }

      /* ---------------- HEADER ---------------- */
      function Header({ sessao, squad, setSquad, view, setView, onLogout, busca, setBusca, resp, setResp, reps }) {
        const diretoria = sessao.papel === "diretoria";
        const tabs = [
          { key: "resumo", label: "Resumo" }, { key: "renovacoes", label: "Renovações" }, { key: "reunioes", label: "Reuniões" },
          { key: "nps", label: "NPS" }, { key: "demandas", label: "Demandas" }, { key: "clientes", label: "Clientes" },
          { key: "evolucao", label: "Evolução" }, { key: "out", label: "Clientes Out" },
        ];
        const squads = [{ key: "todos", label: "Todos" }, { key: "azul", label: "Azul" }, { key: "laranja", label: "Laranja" }];
        const accent = diretoria ? "#2563eb" : SQUADS[sessao.squad].cor;
        const barColor = diretoria ? (squad === "todos" ? "#2563eb" : SQUADS[squad].cor) : accent;
        const [scrolled, setScrolled] = useState(false);
        useEffect(() => {
          let raf = 0;
          const on = () => { if (raf) return; raf = requestAnimationFrame(() => { setScrolled(window.scrollY > 4); raf = 0; }); };
          window.addEventListener("scroll", on, { passive: true });
          return () => { window.removeEventListener("scroll", on); if (raf) cancelAnimationFrame(raf); };
        }, []);
        return (
          <header className={`sticky top-0 z-20 bg-slate-950/70 backdrop-blur-md border-b border-slate-800 transition-shadow duration-300 ${scrolled ? "shadow-lg shadow-black/40" : ""}`}>
            <div key={squad + barColor} className="h-0.5 w-full fd-accent" style={{ background: `linear-gradient(90deg, ${barColor}, transparent 70%)` }} />
            <div className="max-w-6xl mx-auto px-4 py-3">
              <div className="flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
                <div className="flex items-center gap-2.5 min-w-0"><div className="w-8 h-8 rounded-xl text-white grid place-items-center font-extrabold text-sm shrink-0 fd-logo" style={{ background: accent, boxShadow: `0 0 9px -4px ${accent}` }}>F</div><div className="leading-tight min-w-0"><div className="font-bold text-slate-100 text-[15px] tracking-tight truncate">{sessao.nome}</div><div className="text-[11px] text-slate-500 flex items-center gap-1.5">{HOJE_LONGA}{(() => { const av = (FD.integrations.squadsAoVivo && FD.integrations.squadsAoVivo()) || []; return av.length ? <span className="text-emerald-400/90 hidden sm:inline" title={"ClickUp ao vivo: " + av.join(", ")}>· <span className="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 fd-live align-middle" /> ClickUp ao vivo ({av.join(", ")})</span> : <span className="text-amber-500/80 hidden sm:inline" title="Sincronização real entra na fase de integração">· dados de exemplo</span>; })()}</div></div></div>
                <div className="flex items-center gap-2 ml-auto">
                  {diretoria && <div className="flex bg-slate-800/80 rounded-xl p-0.5">{squads.map((s) => { const active = squad === s.key; const ac = s.key === "azul" ? "text-blue-300" : s.key === "laranja" ? "text-orange-300" : "text-slate-100"; return <button key={s.key} onClick={() => setSquad(s.key)} className={`px-2.5 min-h-[40px] inline-flex items-center text-[12px] font-semibold rounded-lg transition ${active ? `bg-slate-700 ${ac}` : "text-slate-400"}`}>{s.label}</button>; })}</div>}
                  <div className="relative"><input value={busca || ""} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar cliente…" aria-label="Buscar cliente" className="text-[13px] bg-slate-800/80 border border-slate-700 rounded-xl pl-7 pr-6 min-h-[40px] w-32 sm:w-44 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40" /><span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 text-[12px]" aria-hidden="true">🔍</span>{busca && <button onClick={() => setBusca("")} title="Limpar" aria-label="Limpar busca" className="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs">✕</button>}</div>
                  <RepSelector reps={reps} resp={resp} setResp={setResp} />
                  <button onClick={() => setView("integracoes")} title="Integrações" aria-label="Integrações" className={`text-base px-2 min-h-[44px] min-w-[44px] inline-flex items-center justify-center rounded-lg transition ${view === "integracoes" ? "text-blue-300 bg-slate-800" : "text-slate-400 hover:text-slate-200"}`}><span aria-hidden="true">⚙</span></button>
                  <button onClick={onLogout} className="text-[12px] font-medium text-slate-400 hover:text-red-400 px-2 min-h-[44px] inline-flex items-center">Sair</button>
                </div>
              </div>
              <nav className="flex gap-1 mt-3 overflow-x-auto">{tabs.map((t) => { const active = view === t.key || (view === "detalhe" && t.key === "clientes"); return <button key={t.key} aria-current={active ? "page" : undefined} onClick={() => setView(t.key)} className={`px-3 min-h-[40px] inline-flex items-center text-[13px] font-semibold rounded-lg transition active:scale-95 whitespace-nowrap ${active ? "bg-blue-600 text-white fd-glow-on" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/60"}`}>{t.label}</button>; })}</nav>
            </div>
          </header>
        );
      }

      /* ---------------- SAÚDE DA CARTEIRA ---------------- */
      function SaudeCarteira({ escolas, label, setView }) {
        const total = escolas.length || 1;
        const cont = { verde: 0, amarelo: 0, laranja: 0, vermelho: 0 };
        escolas.forEach((e) => cont[e.crit.nivel]++);
        const emRisco = escolas.filter((e) => e.crit.riscoChurn).length;
        const pct = (n) => (n / total) * 100;
        return (
          <div className={`${CARD} p-5`}>
            <div className="flex items-end justify-between flex-wrap gap-4">
              <div><div className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Saúde da carteira{label ? ` · ${label}` : ""}</div><div className="flex items-baseline gap-2 mt-1.5"><span className="text-4xl font-extrabold text-emerald-300 tracking-tight fd-neon">{Math.round(pct(cont.verde))}%</span><span className="text-sm text-slate-400">saudáveis · {escolas.length} clientes</span></div></div>
              {emRisco > 0 && setView ? (
                <button onClick={() => setView("clientes")} className="text-right group rounded-xl -m-1 p-1 transition hover:bg-slate-800/40" title="Ver clientes em risco (ordenados por prioridade)"><div className="text-3xl font-extrabold text-red-400">{emRisco}</div><div className="text-[11px] text-slate-400 group-hover:text-slate-300 flex items-center justify-end gap-1">em risco de churn <span className="text-slate-500 group-hover:text-blue-300 transition">›</span></div></button>
              ) : (
                <div className="text-right"><div className="text-3xl font-extrabold text-slate-100">{emRisco}</div><div className="text-[11px] text-slate-400">em risco de churn</div></div>
              )}
            </div>
            <div className="mt-4 h-2.5 rounded-full overflow-hidden flex bg-slate-800"><div style={{ width: pct(cont.verde) + "%" }} className="bg-emerald-500 fd-grow transition-[width] duration-700 ease-out" /><div style={{ width: pct(cont.amarelo) + "%" }} className="bg-amber-400 fd-grow transition-[width] duration-700 ease-out" /><div style={{ width: pct(cont.laranja) + "%" }} className="bg-orange-500 fd-grow transition-[width] duration-700 ease-out" /><div style={{ width: pct(cont.vermelho) + "%" }} className="bg-red-500 fd-grow transition-[width] duration-700 ease-out" /></div>
            <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-[12px] text-slate-400"><Legend color="bg-emerald-500" n={cont.verde} t="saudáveis" /><Legend color="bg-amber-400" n={cont.amarelo} t="atenção" /><Legend color="bg-orange-500" n={cont.laranja} t="críticos" /><Legend color="bg-red-500" n={cont.vermelho} t="muito críticos" /></div>
          </div>
        );
      }

      /* ---------------- AÇÕES ---------------- */
      function AcaoRow({ a, showSquad, onClick, tone }) {
        const chip = tone === "critica" ? "bg-red-500/15" : "bg-amber-500/15";
        return <button onClick={onClick} className={`group w-full flex items-center gap-3 px-3 py-2.5 rounded-xl ${ROW_HOVER} text-left transition`}><span className={`grid place-items-center w-9 h-9 rounded-xl text-lg shrink-0 ${chip}`}>{a.icon}</span><div className="flex-1 min-w-0"><div className="text-sm font-semibold text-slate-100 truncate">{a.titulo}</div><div className="text-[12px] text-slate-400 truncate flex items-center gap-1.5">{showSquad && <SquadBadge squad={a.squad} small />}<span className="truncate">{a.motivo}</span></div></div><Chevron /></button>;
      }
      function PainelAcoes({ titulo, sub, acoes, vazio, dot, tone, showSquad, abrirCliente, verTudo, max = 7 }) {
        const mostradas = acoes.slice(0, max);
        const resto = acoes.length - mostradas.length;
        return (
          <div className={`${CARD} flex flex-col`}>
            <div className="flex items-center justify-between px-4 py-3 border-b border-slate-800"><div className={`flex items-center gap-2 text-sm ${H}`}><span className={`w-2.5 h-2.5 rounded-full ${dot}`} />{titulo}<span className="text-slate-500 font-medium text-[12px]">{sub}</span></div><span className="text-xs font-bold text-slate-300 bg-slate-800 rounded-full px-2 py-0.5">{acoes.length}</span></div>
            {acoes.length === 0 ? <div className="px-4 py-10 text-center text-sm text-slate-500">{vazio}</div> : <div className="p-1.5">{mostradas.map((a) => <AcaoRow key={a.id} a={a} tone={tone} showSquad={showSquad} onClick={() => abrirCliente(a.escolaId)} />)}{resto > 0 && verTudo && <button onClick={verTudo} className="w-full text-left px-3 py-2 text-[12px] font-medium text-blue-400 hover:underline">+{resto} ações — ver todos os clientes</button>}</div>}
          </div>
        );
      }

      /* ---------------- RESUMO (HOME — só o essencial diário) ---------------- */
      function PrioritarioRow({ e, showSquad, onClick }) {
        const rec = FD.engine.recomendacoes(e)[0];
        const vermelho = e.crit.nivel === "vermelho";
        return (
          <button onClick={onClick} className={`group w-full text-left px-4 py-3 ${ROW_HOVER} flex items-start gap-3 transition`}>
            <span className={vermelho ? "fd-dot mt-1" : "mt-1"}><Semaforo nivel={e.crit.nivel} size={12} /></span>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap"><span className="font-bold text-slate-100 text-sm truncate">{e.nome}</span>{showSquad && <SquadBadge squad={e.squad} small />}<span className={`text-[10px] px-1.5 py-0.5 rounded font-semibold ${e.crit.chanceNivel === "vermelho" ? "bg-red-500/15 text-red-300" : e.crit.chanceNivel === "amarelo" ? "bg-amber-500/15 text-amber-300" : "bg-emerald-500/15 text-emerald-300"}`}>renovar {e.crit.chanceRenovar}%</span></div>
              <div className="text-[12px] text-slate-400 truncate mt-0.5">{e.crit.motivos.slice(0, 3).join(" · ")}</div>
              {rec && <div className="text-[12px] text-blue-200/90 mt-1 flex items-start gap-1.5"><span>{rec.icon}</span><span className="line-clamp-1">{rec.txt}</span></div>}
            </div>
            <Chevron />
          </button>
        );
      }
      function AgendaDoDia({ eventos }) {
        const hoje0 = new Date(FD.NOW); hoje0.setHours(0, 0, 0, 0);
        const diffDia = (k) => { const d = new Date(k + "T00:00:00"); d.setHours(0, 0, 0, 0); return Math.round((d - hoje0) / 86400000); };
        const rotulo = (k) => { const n = diffDia(k); return n === 0 ? "Hoje" : n === 1 ? "Amanhã" : new Date(k + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "short" }); };
        const hora = (iso) => new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
        const grupos = {};
        (eventos || []).forEach((ev) => { const k = (ev.inicio || "").slice(0, 10); if (!k) return; (grupos[k] = grupos[k] || []).push(ev); });
        const dias = Object.keys(grupos).sort();
        return (
          <div className={`${CARD} overflow-hidden`}>
            <div className="px-4 py-3 border-b border-slate-800 text-sm flex items-center justify-between"><span className={H}>🗓️ Reuniões do dia</span><span className="text-slate-500 text-[12px]">hoje + próximos dias</span></div>
            {dias.length === 0 ? <div className="px-4 py-8 text-center text-sm text-slate-500">Sem reuniões nos próximos dias.</div> : (
              <div className="divide-y divide-slate-800 max-h-80 overflow-auto">
                {dias.map((k) => (
                  <div key={k} className="px-4 py-2.5">
                    <div className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-1.5">{rotulo(k)} <span className="text-slate-500">· {grupos[k].length}</span></div>
                    <div className="space-y-1">
                      {grupos[k].map((ev) => (
                        <div key={ev.id} className="flex items-center gap-3 py-1">
                          <span className="text-[12px] font-bold text-blue-300 w-14 shrink-0">{ev.diaInteiro ? "dia" : hora(ev.inicio)}</span>
                          <span className="text-[13px] text-slate-100 truncate flex-1">{ev.titulo}</span>
                          {ev.link && <a href={ev.link} target="_blank" rel="noreferrer" className="text-[12px] text-blue-400 hover:underline shrink-0">abrir</a>}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }
      function ProximasDemandas({ escolas, showSquad, abrirCliente }) {
        const hoje0 = new Date(FD.NOW); hoje0.setHours(0, 0, 0, 0);
        const diff = (iso) => { const d = new Date(iso); d.setHours(0, 0, 0, 0); return Math.round((d - hoje0) / 86400000); };
        const itens = [];
        escolas.forEach((e) => (e.demandas || []).filter((d) => d.status !== "concluída" && d.prazo && diff(d.prazo) >= 0 && diff(d.prazo) <= 7).forEach((d) => itens.push({ ...d, escola: e, k: diff(d.prazo) })));
        itens.sort((a, b) => a.k - b.k);
        return (
          <div className={`${CARD} overflow-hidden`}>
            <div className="px-4 py-3 border-b border-slate-800 text-sm flex items-center justify-between"><span className={H}>⏱️ Próximas demandas</span><span className="text-slate-500 text-[12px]">próximos 7 dias · {itens.length}</span></div>
            {itens.length === 0 ? <div className="px-4 py-8 text-center text-sm text-slate-500">Nenhuma demanda com prazo nos próximos 7 dias.</div> : (
              <div className="divide-y divide-slate-800 max-h-80 overflow-auto">{itens.slice(0, 10).map((d) => (
                <button key={d.id} onClick={() => abrirCliente(d.escola.id)} className={`group w-full text-left px-4 py-2 ${ROW_HOVER} flex items-center gap-3`}>
                  <span className={`text-[12px] font-bold w-12 shrink-0 ${d.k === 0 ? "text-amber-400" : "text-slate-400"}`}>{d.k === 0 ? "hoje" : `${d.k}d`}</span>
                  <div className="flex-1 min-w-0"><div className="text-[13px] font-semibold text-slate-100 truncate">{d.titulo}</div><div className="text-[11px] text-slate-500 flex items-center gap-1.5">{showSquad && <SquadBadge squad={d.escola.squad} small />}<span className="truncate">{d.escola.nome}</span></div></div>
                  <span className="hidden sm:inline text-[11px] text-slate-400 truncate w-24 text-right">{d.responsavel}</span>
                </button>
              ))}</div>
            )}
          </div>
        );
      }
      function Resumo({ escolas, label, showSquad, abrirCliente, setView, agenda }) {
        const semana = FD.engine.acoes(escolas).filter((a) => a.urgencia === "semana");
        const nps = FD.engine.npsResumo(escolas);
        const renov = FD.engine.renovacoes(escolas);
        const renov60 = renov.filter((r) => r.dias != null && r.dias <= 60).length;
        const reunPend = escolas.filter((e) => e.crit.semReuniao).length;
        const prio = FD.engine.prioritarios(escolas).filter((e) => e.crit.nivel !== "verde").slice(0, 5);
        const temVermelho = prio.length && prio[0].crit.nivel === "vermelho";
        return (
          <div className="space-y-5">
            <SaudeCarteira escolas={escolas} label={label} setView={setView} />
            <div className="grid grid-cols-3 gap-2 sm:gap-3">
              <KpiMini label="NPS escolas" value={nps.externo.media == null ? "—" : npsDisp(nps.externo.media)} sub="média /5 →" tone={corNps(nps.externo.media)} onClick={() => setView("nps")} />
              <KpiMini label="Renov. ≤60d" value={renov60} sub={`${renov.filter((r) => r.dias != null && r.dias < 0).length} vencidas`} tone={renov60 ? "amber" : "green"} onClick={() => setView("renovacoes")} />
              <KpiMini label="Reuniões" value={reunPend} sub="quinzenal →" tone={reunPend ? "amber" : "green"} onClick={() => setView("reunioes")} />
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 sm:gap-5">
              <AgendaDoDia eventos={agenda} />
              <ProximasDemandas escolas={escolas} showSquad={showSquad} abrirCliente={abrirCliente} />
            </div>
            <div className={`${CARD} ${temVermelho ? "fd-glow" : ""}`}>
              <div className="flex items-center justify-between px-4 py-3 border-b border-slate-800">
                <div className={`flex items-center gap-2 text-sm ${H}`}><span>🚨</span>Clientes prioritários<span className="text-slate-500 font-medium text-[12px]">quem está mais negativo + o que fazer</span></div>
                <button onClick={() => setView("clientes")} className="text-[12px] text-blue-400 hover:underline">ver todos</button>
              </div>
              {prio.length === 0 ? <div className="px-4 py-10 text-center text-sm text-slate-500">Nenhum cliente em risco agora 🎉 carteira saudável.</div> : <div className="p-1.5">{prio.map((e) => <PrioritarioRow key={e.id} e={e} showSquad={showSquad} onClick={() => abrirCliente(e.id)} />)}</div>}
            </div>
            <PainelAcoes titulo="Esta semana" sub="80/20 · tarefas que evitam virar crítico" dot="bg-amber-400" tone="semana" acoes={semana} vazio="Sem pendências para a semana 👌" showSquad={showSquad} abrirCliente={abrirCliente} verTudo={() => setView("clientes")} max={6} />
          </div>
        );
      }

      /* ---------------- RENOVAÇÕES ---------------- */
      function Renovacoes({ escolas, showSquad, abrirCliente }) {
        const [ord, setOrd] = useState("proxima");
        const base = FD.engine.renovacoes(escolas); // já vem por proximidade (null no fim)
        const comData = base.filter((x) => x.dias != null);
        const semData = base.length - comData.length;
        const vencidas = comData.filter((x) => x.dias < 0).length;
        const d30 = comData.filter((x) => x.dias >= 0 && x.dias <= 30).length;
        const chanceMedia = escolas.length ? Math.round(escolas.reduce((s, e) => s + e.crit.chanceRenovar, 0) / escolas.length) : 0;
        const emRisco = base.filter((x) => x.dias != null && x.dias <= 45 && x.escola.crit.chanceRenovar < 45).length; // renovação ≤45d + chance baixa (M3)
        let lista;
        if (ord === "distante") {
          const sem = base.filter((x) => x.dias == null);
          lista = comData.slice().sort((a, b) => b.dias - a.dias).concat(sem); // mais tempo no topo
        } else if (ord === "critico") {
          lista = base.slice().sort((a, b) => b.escola.crit.score - a.escola.crit.score); // mais crítico no topo
        } else {
          lista = base; // "proxima": vence antes (padrão)
        }
        // Cor por proximidade da renovação (verde -> amarelo -> laranja -> vermelho).
        const corRenov = (d) => {
          if (d == null) return "slate";
          if (d < 15) return "red";              // <15 dias ou vencida
          if (d < 30) return "orange";           // 15–29 dias
          if (d < 45) return "amber";            // 30–44 dias
          return "green";                        // 45 dias+
        };
        const [filtroCor, setFiltroCor] = useState(null);
        const corCnt = (cc) => base.filter((x) => corRenov(x.dias) === cc).length;
        const listaF = filtroCor ? lista.filter(({ dias }) => corRenov(dias) === filtroCor) : lista;
        const legenda = [
          { cor: "green", dot: "bg-emerald-500", label: "tranquilo (45d+)", n: corCnt("green") },
          { cor: "amber", dot: "bg-amber-400", label: "atenção (30–45d)", n: corCnt("amber") },
          { cor: "orange", dot: "bg-orange-500", label: "proposta (15–30d)", n: corCnt("orange") },
          { cor: "red", dot: "bg-red-500", label: "urgente (<15d/venc.)", n: corCnt("red") },
          { cor: "slate", dot: "bg-slate-700", label: "sem data", n: corCnt("slate") },
        ];
        return (
          <div className="space-y-4">
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
              <KpiMini label="Vencidas" value={vencidas} sub="renegociar já" tone={vencidas ? "red" : "green"} />
              <KpiMini label="Próximos 30 dias" value={d30} tone={d30 ? "amber" : "slate"} />
              <KpiMini label="Risco de não renovar" value={emRisco} sub="≤45d + chance baixa" tone={emRisco ? "red" : "green"} />
              <KpiMini label="Sem data no ClickUp" value={semData} sub="cadastrar contrato" tone={semData ? "amber" : "green"} />
              <KpiMini label="Chance média" value={chanceMedia + "%"} sub="de renovação" tone={chanceMedia >= 70 ? "green" : chanceMedia >= 45 ? "amber" : "red"} />
            </div>
            <div className={`${CARD} overflow-hidden`}>
              <div className="px-4 py-3 border-b border-slate-800 text-sm flex items-center justify-between gap-2">
                <span className={H}>Renovações · todos os clientes</span>
                <select value={ord} onChange={(ev) => setOrd(ev.target.value)} aria-label="Ordenar renovações" className="text-[12px] bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-slate-500">
                  <option value="proxima">Vence antes (mais próxima)</option>
                  <option value="distante">Vence depois (mais tempo)</option>
                  <option value="critico">Mais crítico</option>
                </select>
              </div>
              <FiltroCores itens={legenda} ativo={filtroCor} onToggle={(c) => setFiltroCor((f) => (f === c ? null : c))} />
              <div className="divide-y divide-slate-800 fd-stagger">
                {listaF.length === 0 && <div className="px-4 py-8 text-center text-sm text-slate-500">Nenhum cliente nessa cor.</div>}
                {listaF.map(({ escola: e, dias }) => { const cor = corRenov(dias); return (
                  <button key={e.id} onClick={() => abrirCliente(e.id)} className={`group w-full text-left px-4 py-3 ${ROW_HOVER} flex items-center gap-3`}>
                    <span className={`w-1 self-stretch rounded-full shrink-0 ${STATUS_BARRA[cor]}`} />
                    <div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap"><span className="font-semibold text-slate-100 text-sm truncate">{e.nome}</span>{showSquad && <SquadBadge squad={e.squad} small />}{dias == null && <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-slate-700/60 text-slate-300">sem data no ClickUp</span>}{dias != null && dias <= 45 && e.crit.chanceRenovar < 45 && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-rose-500/15 text-rose-300">risco de não renovar</span>}</div><div className="text-[12px] text-slate-400 mt-0.5 flex items-center gap-2"><span className={dias == null ? "text-slate-500 italic" : `${STATUS_TXT[cor]} font-bold`}>{dias == null ? "cadastrar fim do contrato" : renovTxt(dias)}</span><span className="text-slate-600">·</span><span>{mesesAtivoTxt(e)} ativo</span></div></div>
                    <div className="hidden sm:flex gap-1 shrink-0"><NpsChip label="ext" valor={e.npsExterno} /></div>
                    <ChanceBar pct={e.crit.chanceRenovar} nivel={e.crit.chanceNivel} />
                    <Chevron />
                  </button>
                ); })}
              </div>
            </div>
          </div>
        );
      }

      /* ---------------- REUNIÕES (quinzenal + pauta) ---------------- */
      function Reunioes({ escolas, showSquad, abrirCliente }) {
        const [desc, setDesc] = useState(true); // true = mais atrasado primeiro
        const [, setTick] = useState(0); // re-render ao marcar/desmarcar tentativa (M5d)
        const lista = escolas.map((e) => ({
          e,
          dias: e.crit.diasSemReuniao,
          pendente: e.crit.semReuniao,
          temUltima: !!e.ultimaReuniao,
          proxDias: e.proximaReuniao ? diasAte(e.proximaReuniao) : null,
          tent: FD.clienteStore.tentativa(e.nome), // lido 1x por cliente (não por uso)
        }));
        lista.sort((a, b) => (desc ? b.dias - a.dias : a.dias - b.dias));
        const pendentes = lista.filter((x) => x.pendente).length;
        const agendadas = lista.filter((x) => x.proxDias != null && x.proxDias >= 0).length;
        // Cor por cadência (quinzenal): AZUL = já marcada; senão pelo tempo sem reunião.
        const corDe = (x) => {
          const agendada = x.proxDias != null && x.proxDias >= 0;
          const emDia = x.temUltima && x.dias < 12;                    // reunião recente (<12d) -> não precisa contato
          if (!agendada && !emDia && x.tent.ativa) return "tentativa"; // contato já feito (M5d)
          if (agendada) return "blue";                                 // reunião marcada
          if (!x.temUltima) return "slate";                            // sem registro de reunião
          const d = x.dias;
          if (d >= 15) return "red";                                   // passou da quinzena -> MUITO CRÍTICO
          if (d >= 12) return "amber";                                 // atenção (chegando nos 15d)
          return "green";                                              // em dia
        };
        const [filtroCor, setFiltroCor] = useState(null);
        // PERF: cor computada 1x por cliente (antes: legenda 6x + filtro + linha, por render)
        lista.forEach((x) => { x.cor = corDe(x); });
        const corCnt = (cc) => lista.reduce((n, x) => n + (x.cor === cc ? 1 : 0), 0);
        const listaF = filtroCor ? lista.filter((x) => x.cor === filtroCor) : lista;
        const legenda = [
          { cor: "blue", dot: "bg-blue-500", label: "marcada", n: corCnt("blue") },
          { cor: "green", dot: "bg-emerald-500", label: "em dia (<12d)", n: corCnt("green") },
          { cor: "amber", dot: "bg-amber-400", label: "atenção (12–14d)", n: corCnt("amber") },
          { cor: "red", dot: "bg-red-500", label: "muito crítico (15d+)", n: corCnt("red") },
          { cor: "tentativa", dot: "bg-violet-500", label: "contato feito (24h)", n: corCnt("tentativa") },
          { cor: "slate", dot: "bg-slate-700", label: "sem registro", n: corCnt("slate") },
        ];
        return (
          <div className="space-y-4">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <KpiMini label="Pendentes (+15d)" value={pendentes} sub="agendar já" tone={pendentes ? "red" : "green"} />
              <KpiMini label="Reuniões marcadas" value={agendadas} sub="já agendadas" tone={agendadas ? "green" : "slate"} />
              <KpiMini label="Em dia" value={lista.length - pendentes} tone="green" />
              <KpiMini label="Carteira" value={lista.length} sub="cadência quinzenal" tone="slate" />
            </div>
            <div className={`${CARD} overflow-hidden`}>
              <div className="px-4 py-3 border-b border-slate-800 text-sm flex items-center justify-between">
                <span className={H}>Reuniões · todos os clientes</span>
                <button onClick={() => setDesc((d) => !d)} className="text-[12px] font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg px-2.5 py-1 inline-flex items-center gap-1">{desc ? "Mais atrasado primeiro" : "Mais recente primeiro"} <span className="text-slate-500">{desc ? "↓" : "↑"}</span></button>
              </div>
              <FiltroCores itens={legenda} ativo={filtroCor} onToggle={(c) => setFiltroCor((f) => (f === c ? null : c))} />
              {listaF.length === 0 ? <div className="px-4 py-10 text-center text-sm text-slate-500">Nenhum cliente nessa cor.</div> : (
                <div className="divide-y divide-slate-800 fd-stagger">
                  {listaF.map((x) => { const { e, dias, temUltima, proxDias, cor, tent } = x; const agendada = proxDias != null && proxDias >= 0; const podeContato = !agendada && !(temUltima && dias < 12); return (
                    <div key={e.id} className={`group w-full ${ROW_HOVER} flex items-center gap-3 px-4 py-3 ${cor === "tentativa" ? "bg-violet-500/10" : cor === "blue" ? "bg-blue-500/5" : ""}`}>
                      <span className={`w-1 self-stretch rounded-full shrink-0 ${STATUS_BARRA[cor]}`} />
                      <Semaforo nivel={e.crit.nivel} size={10} />
                      <button onClick={() => abrirCliente(e.id)} className="flex-1 min-w-0 text-left">
                        <div className="flex items-center gap-2 flex-wrap"><span className="font-semibold text-slate-100 text-sm truncate">{e.nome}</span>{showSquad && <SquadBadge squad={e.squad} small />}{agendada && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-blue-500/15 text-blue-300">📅 marcada</span>}{tent.ativa && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-violet-500/15 text-violet-300">✓ contato feito</span>}</div>
                        <div className={`text-[12px] mt-0.5 ${tent.ativa ? "text-violet-300/90 font-semibold" : agendada ? "text-blue-300/90 font-semibold" : "text-slate-500"}`}>{tent.ativa ? `contato feito · reseta em ${Math.ceil(tent.restanteMs / 3600000)}h` : agendada ? `marcada p/ ${dataCurta(e.proximaReuniao)} · em ${proxDias}d` : (proxDias != null ? "próxima vencida — reagendar" : "sem reunião agendada")}</div>
                      </button>
                      <span className={`text-[12px] font-bold shrink-0 ${STATUS_TXT[cor]}`}>{temUltima ? `${dias}d sem reunião` : "nunca"}</span>
                      {podeContato && (tent.ativa
                        ? <button onClick={() => { FD.clienteStore.limparTentativa(e.nome); setTick((t) => t + 1); }} title="Desfazer — o contato ainda não foi feito" className="text-[11px] font-semibold text-violet-200 bg-violet-500/15 hover:bg-violet-500/25 rounded-lg px-2 py-1 shrink-0">desfazer</button>
                        : <button onClick={() => { FD.clienteStore.marcarTentativa(e.nome); setTick((t) => t + 1); }} title="Sinaliza que você já fez o contato para agendar a reunião (reseta sozinho em 24h)" className="text-[11px] font-semibold text-slate-200 bg-slate-700 hover:bg-slate-600 rounded-lg px-2 py-1 shrink-0">✓ marcar contato</button>)}
                      <Chevron />
                    </div>
                  ); })}
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ---------------- NPS (dividido: externo x interno) ---------------- */
      function NpsCard({ titulo, subtitulo, bloco, accent }) {
        const total = bloco.respondentes || 1;
        const pct = (n) => (n / total) * 100;
        const m = bloco.media == null ? null : Number(bloco.media);
        // mesmo critério de corNps (>=7 promotor · >=6 neutro · >=5 insatisfeito · <5 crítico)
        const scoreTone = { green: "text-emerald-400", amber: "text-amber-400", orange: "text-orange-400", red: "text-red-400", slate: "text-slate-400" }[corNps(m)] || "text-slate-400";
        return (
          <div className={`${CARD} p-5`}>
            <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full" style={{ background: accent }} /><div className="text-sm font-bold text-slate-100">{titulo}</div></div>
            <div className="text-[11px] text-slate-500 mt-0.5">{subtitulo}</div>
            <div className="flex items-baseline gap-2 mt-3"><span className={`text-5xl font-extrabold tracking-tight fd-neon ${scoreTone}`}>{bloco.media == null ? "—" : npsDisp(bloco.media)}</span><span className="text-sm text-slate-400">deste mês /5 · {bloco.respondentes} respostas</span></div>
            {bloco.media3m != null && <div className="mt-1 text-[12px] text-slate-400">Geral últimos 3 meses: <span className="font-bold text-slate-200 fd-neon">{npsDisp(bloco.media3m)}</span> <span className="text-slate-500">/5</span></div>}
            <div className="mt-4 h-2.5 rounded-full overflow-hidden flex bg-slate-800"><div style={{ width: pct(bloco.prom) + "%" }} className="bg-emerald-500 fd-grow transition-[width] duration-700 ease-out" /><div style={{ width: pct(bloco.neutro) + "%" }} className="bg-slate-500 fd-grow transition-[width] duration-700 ease-out" /><div style={{ width: pct(bloco.detr) + "%" }} className="bg-red-500 fd-grow transition-[width] duration-700 ease-out" /></div>
            <div className="flex justify-between mt-2 text-[12px]"><span className="text-emerald-300">{bloco.prom} promotores</span><span className="text-slate-400">{bloco.neutro} neutros</span><span className="text-red-300">{bloco.detr} detratores</span></div>
            <div className="text-[11px] text-slate-500 mt-2">{bloco.semResposta} sem coleta · índice NPS {bloco.score == null ? "—" : bloco.score} <span className="text-slate-500">(promotores − detratores, −100 a 100)</span></div>
          </div>
        );
      }
      function NpsView({ escolas, showSquad, abrirCliente }) {
        const r = FD.engine.npsResumo(escolas);
        const setoresResumo = FD.engine.npsSetoresResumo(escolas); // diagnóstico agregado por setor (M1)
        const [ascExt, setAscExt] = useState(true); // ordenação INDEPENDENTE por lista
        const [ascInt, setAscInt] = useState(true);
        const [filtroExt, setFiltroExt] = useState(null); // filtro de cor INDEPENDENTE por lista
        const [filtroInt, setFiltroInt] = useState(null);
        const externos = escolas.filter((e) => e.npsExterno != null).sort((a, b) => (ascExt ? 1 : -1) * (a.npsExterno - b.npsExterno));
        const internos = escolas.filter((e) => e.npsInterno != null).sort((a, b) => (ascInt ? 1 : -1) * (a.npsInterno - b.npsInterno));
        // Funções (não componentes): chamadas como {ordBtn(...)} / {listaCli(...)} —
        // assim o React NÃO vê um tipo novo a cada render e as listas reconciliam
        // no lugar (preserva scroll e não re-anima o stagger a cada filtro/ordenação).
        const ordBtn = (asc, setAsc) => (
          <button onClick={() => setAsc((a) => !a)} className="text-[11px] font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 rounded px-2 py-0.5 shrink-0">{asc ? "pior → melhor ↑" : "melhor → pior ↓"}</button>
        );
        // Cor por NPS (clássico, detrator dividido em 2): promotor / neutro / insatisfeito / crítico.
        const tone = (v) => NPS_TXT[corNps(v)];
        const legendaNps = (campo) => {
          const cnt = (cc) => escolas.filter((e) => e[campo] != null && corNps(e[campo]) === cc).length;
          return [
            { cor: "green", dot: "bg-emerald-500", label: "promotor (7+)", n: cnt("green") },
            { cor: "amber", dot: "bg-amber-400", label: "neutro (6–7)", n: cnt("amber") },
            { cor: "orange", dot: "bg-orange-500", label: "insatisfeito (5–6)", n: cnt("orange") },
            { cor: "red", dot: "bg-red-500", label: "crítico (≤4)", n: cnt("red") },
          ];
        };
        const fExt = filtroExt ? externos.filter((e) => corNps(e.npsExterno) === filtroExt) : externos;
        const fInt = filtroInt ? internos.filter((e) => corNps(e.npsInterno) === filtroInt) : internos;
        const listaCli = (itens, campo, vazio) => (
          itens.length === 0 ? <div className="px-4 py-8 text-center text-sm text-slate-500">{vazio}</div> :
          <div className="divide-y divide-slate-800 max-h-96 overflow-auto fd-stagger">{itens.map((e) => { const v = e[campo]; const cor = corNps(v); return (
            <button key={e.id} onClick={() => abrirCliente(e.id)} className={`group w-full text-left px-4 py-2.5 ${ROW_HOVER} flex items-center gap-3 ${cor === "red" ? "bg-red-500/5" : ""}`}>
              <div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap"><span className="font-semibold text-slate-100 text-[13px] truncate">{e.nome}</span>{showSquad && <SquadBadge squad={e.squad} small />}{cor === "red" && <span className="text-[10px] font-bold text-rose-300 bg-rose-500/15 rounded px-1.5">crítico</span>}{cor === "orange" && <span className="text-[10px] font-bold text-orange-300 bg-orange-500/15 rounded px-1.5">insatisfeito</span>}</div><div className="text-[11px] text-slate-500 mt-0.5">renovar: {e.crit.chanceRenovar}%{e.crit.semReuniao ? ` · ${e.crit.diasSemReuniao}d sem reunião` : ""}</div></div>
              <span className={`text-base font-bold shrink-0 ${tone(v)}`}>{npsDisp(v)}</span><Chevron />
            </button>
          ); })}</div>
        );
        return (
          <div className="space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <NpsCard titulo="NPS Externo" subtitulo="satisfação das escolas (clientes)" bloco={r.externo} accent="#22c55e" />
              <NpsCard titulo="NPS Interno" subtitulo="avaliação do time sobre cada conta" bloco={r.interno} accent="#60a5fa" />
            </div>
            {setoresResumo.setores.length > 0 && (
              <div className={`${CARD} p-5`}>
                <div className="font-bold text-slate-100 text-sm flex items-center gap-2">🔍 Diagnóstico por setor <span className="text-[11px] text-slate-500 font-medium">· NPS externo · média do escopo atual</span></div>
                <div className="text-[12px] mt-1 mb-3">{setoresResumo.fracos.length
                  ? <span className="text-slate-400">⚠ Setores a melhorar: <b className="text-rose-300">{setoresResumo.fracos.map((s) => s.pergunta).join(" · ")}</b></span>
                  : <span className="text-emerald-300">Todos os setores bem avaliados pelos clientes 👏</span>}</div>
                <div className="space-y-1.5">
                  {setoresResumo.setores.map((s, i) => { const cor = corNps(s.media); return (
                    <div key={i} className="flex items-center gap-2.5 text-[13px]">
                      <span className={`w-2 h-2 rounded-full shrink-0 ${NPS_DOT[cor]}`} />
                      <span className="flex-1 min-w-0 text-slate-300 truncate" title={s.pergunta}>{s.pergunta}</span>
                      <span className="text-[10px] text-slate-500 hidden sm:inline">{s.nClientes} cliente{s.nClientes > 1 ? "s" : ""}</span>
                      {s.fraco && <span className="text-[10px] font-bold text-rose-300 bg-rose-500/15 rounded px-1.5">melhorar</span>}
                      <span className={`font-extrabold w-9 text-right fd-neon ${NPS_TXT[cor]}`}>{npsDisp(s.media)}</span>
                    </div>
                  ); })}
                </div>
              </div>
            )}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className={CARD}><div className="px-4 py-3 border-b border-slate-800 text-sm flex items-center justify-between gap-2"><span className="truncate"><span className="font-bold text-slate-100">Notas externas</span> <span className="text-slate-500">· cliente avalia</span></span><div className="flex items-center gap-2 shrink-0">{ordBtn(ascExt, setAscExt)}<span className="text-slate-500 text-[12px]">{externos.length}</span></div></div><FiltroCores itens={legendaNps("npsExterno")} ativo={filtroExt} onToggle={(c) => setFiltroExt((f) => (f === c ? null : c))} />{listaCli(fExt, "npsExterno", "Nenhuma nota nessa faixa.")}</div>
              <div className={CARD}><div className="px-4 py-3 border-b border-slate-800 text-sm flex items-center justify-between gap-2"><span className="truncate"><span className="font-bold text-slate-100">Notas internas</span> <span className="text-slate-500">· time avalia</span></span><div className="flex items-center gap-2 shrink-0">{ordBtn(ascInt, setAscInt)}<span className="text-slate-500 text-[12px]">{internos.length}</span></div></div><FiltroCores itens={legendaNps("npsInterno")} ativo={filtroInt} onToggle={(c) => setFiltroInt((f) => (f === c ? null : c))} />{listaCli(fInt, "npsInterno", "Nenhuma nota interna ainda.")}</div>
            </div>
          </div>
        );
      }

      /* ---------------- CLIENTES ---------------- */
      function Clientes({ escolas, showSquad, abrirCliente }) {
        const [ord, setOrd] = useState("critico");
        const [filtroCor, setFiltroCor] = useState(null);
        let ordenadas;
        if (ord === "critico") ordenadas = FD.engine.prioritarios(escolas);
        else {
          const campo = ord.indexOf("int") === 0 ? "npsInterno" : "npsExterno";
          const melhor = ord.indexOf("melhor") >= 0;
          const com = escolas.filter((e) => e[campo] != null).sort((a, b) => (melhor ? b[campo] - a[campo] : a[campo] - b[campo]));
          const sem = escolas.filter((e) => e[campo] == null); // sem nota vão pro fim
          ordenadas = com.concat(sem);
        }
        // filtro por cor de criticidade (verde/amarelo/laranja/vermelho)
        const NIVCOR = { verde: "green", amarelo: "amber", laranja: "orange", vermelho: "red" };
        const corCnt = (cc) => escolas.filter((e) => NIVCOR[e.crit.nivel] === cc).length;
        const ordenadasF = filtroCor ? ordenadas.filter((e) => NIVCOR[e.crit.nivel] === filtroCor) : ordenadas;
        const legenda = [
          { cor: "green", dot: "bg-emerald-500", label: "saudável", n: corCnt("green") },
          { cor: "amber", dot: "bg-amber-400", label: "atenção", n: corCnt("amber") },
          { cor: "orange", dot: "bg-orange-500", label: "crítico", n: corCnt("orange") },
          { cor: "red", dot: "bg-red-500", label: "muito crítico", n: corCnt("red") },
        ];
        return (
          <div className={`${CARD} overflow-hidden`}>
            <div className="px-4 py-3 border-b border-slate-800 text-sm flex items-center justify-between gap-2">
              <span className={H}>Clientes</span>
              <select value={ord} onChange={(ev) => setOrd(ev.target.value)} aria-label="Ordenar clientes" className="text-[12px] bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-slate-500">
                <option value="critico">Mais crítico</option>
                <option value="ext_pior">NPS externo: pior → melhor</option>
                <option value="ext_melhor">NPS externo: melhor → pior</option>
                <option value="int_pior">NPS interno: pior → melhor</option>
                <option value="int_melhor">NPS interno: melhor → pior</option>
              </select>
            </div>
            <FiltroCores itens={legenda} ativo={filtroCor} onToggle={(c) => setFiltroCor((f) => (f === c ? null : c))} />
            <div className="divide-y divide-slate-800 fd-stagger">
              {ordenadasF.length === 0 && <div className="px-4 py-8 text-center text-sm text-slate-500">Nenhum cliente nessa cor.</div>}
              {ordenadasF.map((e) => (
                <button key={e.id} onClick={() => abrirCliente(e.id)} className={`group w-full text-left px-4 py-3 ${ROW_HOVER} flex items-center gap-3 transition`}>
                  <Semaforo nivel={e.crit.nivel} size={11} />
                  <div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap"><span className="font-semibold text-slate-100 text-sm truncate">{e.nome}</span>{showSquad && <SquadBadge squad={e.squad} small />}{e.fase === "onboarding" && <span className="text-[10px] bg-indigo-500/15 text-indigo-300 rounded px-1.5 py-0.5 font-semibold">onboarding</span>}{temExcecao(e) && <span className="text-[10px] bg-amber-500/15 text-amber-300 rounded px-1.5 py-0.5 font-semibold" title="Preenchimento fora do padrão">⚠ exceção</span>}</div><div className="text-[12px] text-slate-400 truncate mt-0.5">{e.crit.motivos.length ? e.crit.motivos.slice(0, 2).join(" · ") : "Sem alertas"}</div></div>
                  <div className="hidden sm:flex gap-1 shrink-0"><NpsChip label="ext" valor={e.npsExterno} /><NpsChip label="int" valor={e.npsInterno} /></div>
                  <Chevron />
                </button>
              ))}
            </div>
          </div>
        );
      }

      /* ---------------- CLIENTES OUT (saídas + LTV/churn — métricas da empresa) ---------------- */
      function ClientesOut({ escolasOut, ltv, abrirCliente }) {
        const motChip = (m) => /churn/.test(norm(m)) ? "text-rose-300" : /fim de contrato|renov/.test(norm(m)) ? "text-slate-200" : "text-amber-300";
        const porSquad = FD.integrations.ltvPorSquad ? FD.integrations.ltvPorSquad() : null; // LTV médio por squad (M2)
        return (
          <div className="space-y-4">
            <div className="text-[12px] text-slate-400 flex items-center gap-1.5"><span>🏢</span> Métricas consolidadas — LTV e saídas são separados por squad quando o cliente casa com a carteira; o restante entra em <b className="text-slate-300">sem squad</b>.</div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <KpiMini label="LTV médio" value={ltv && ltv.ltvMedio != null ? `${ltv.ltvMedio}` : "—"} sub="meses de vida (todos)" tone="green" />
              <KpiMini label="LTV 2 meses+" value={ltv && ltv.ltv2m != null ? `${ltv.ltv2m}` : "—"} sub={ltv ? `${ltv.retidos2m} clientes 2m+` : "meses"} tone="green" />
              <KpiMini label="Churn" value={ltv ? ltv.churn : "—"} sub={ltv ? `${ltv.churnRate}% · ${ltv.saidas} saídas` : "sem dados"} tone={ltv && ltv.churnRate >= 15 ? "red" : ltv && ltv.churnRate >= 8 ? "amber" : "green"} />
              <KpiMini label="Ativos" value={ltv ? ltv.ativos : "—"} sub={ltv ? `de ${ltv.total} atendidos` : ""} tone="slate" />
            </div>
            {porSquad && (porSquad.azul || porSquad.laranja) && (
              <div className={`${CARD} p-4`}>
                <div className="font-bold text-slate-100 text-sm flex items-center gap-2 mb-3">🏅 LTV médio por squad <span className="text-[11px] text-slate-500 font-medium">· meses de vida{porSquad.semSquad ? ` · ${porSquad.semSquad} sem squad` : ""}</span></div>
                <div className="grid grid-cols-2 gap-3">
                  {["azul", "laranja"].map((sq) => { const R = porSquad[sq]; return (
                    <div key={sq} className="bg-slate-800/60 rounded-xl px-4 py-3 border border-slate-800">
                      <SquadBadge squad={sq} small />
                      <div className="text-2xl font-extrabold text-emerald-300 mt-1.5 fd-neon">{R && R.ltvMedio != null ? R.ltvMedio : "—"}<span className="text-[12px] text-slate-500 font-normal"> meses</span></div>
                      <div className="text-[11px] text-slate-500 mt-0.5">{R && R.total ? `${R.ativos} ativos · ${R.saidas} saídas` : "sem clientes casados"}</div>
                    </div>
                  ); })}
                </div>
              </div>
            )}
            {ltv && ltv.motivos && ltv.motivos.length > 0 && (
              <div className={`${CARD} p-4`}>
                <div className="font-bold text-slate-100 text-sm flex items-center gap-2 mb-3">📉 Motivos das saídas <span className="text-[11px] text-slate-500 font-medium">· {ltv.saidas} saídas no total</span></div>
                <div className="space-y-2">{ltv.motivos.map((m, i) => { const pct = ltv.saidas ? Math.round((m.n / ltv.saidas) * 100) : 0; return (
                  <div key={i} className="flex items-center gap-3">
                    <span className={`text-[13px] w-32 sm:w-48 shrink-0 truncate font-medium ${motChip(m.motivo)}`} title={m.motivo}>{m.motivo}</span>
                    <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden"><div className={`h-full fd-grow rounded-full ${/churn/.test(norm(m.motivo)) ? "bg-rose-500" : "bg-slate-500"}`} style={{ width: pct + "%" }} /></div>
                    <span className="text-[12px] font-bold text-slate-300 w-16 text-right">{m.n} · {pct}%</span>
                  </div>
                ); })}</div>
              </div>
            )}
            <div className={`${CARD} overflow-hidden`}>
              <div className="px-4 py-3 border-b border-slate-800 text-sm flex items-center justify-between"><span className={H}>Clientes que saíram</span><span className="text-slate-500 text-[12px]">{escolasOut.length}</span></div>
              {escolasOut.length === 0 ? <div className="px-4 py-10 text-center text-sm text-slate-500">{ltv ? "Nenhum cliente marcado como saída na planilha." : "Configure a planilha de LTV/Saídas em ⚙ Integrações."}</div> : (
                <div className="divide-y divide-slate-800 fd-stagger">
                  {escolasOut.map((e) => (
                    <button key={e.id} onClick={() => abrirCliente(e.id)} className={`group w-full text-left px-4 py-3 ${ROW_HOVER} flex items-center gap-3`}>
                      <span className={`w-2 h-2 rounded-full shrink-0 ${e.churn ? "bg-rose-500" : "bg-slate-500"}`} />
                      <div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap"><span className="font-semibold text-slate-100 text-sm truncate">{e.nome}</span><span className={`text-[10px] rounded px-1.5 py-0.5 font-semibold ${e.churn ? "bg-rose-500/15 text-rose-300" : "bg-slate-700/60 text-slate-300"}`}>{e.churn ? "churn" : "saiu"}</span></div><div className="text-[12px] text-slate-400 truncate mt-0.5">{e.motivoSaida}{e.motivoDetalhe ? ` · ${e.motivoDetalhe}` : ""}{e.saidaEm ? ` · ${dataCurta(e.saidaEm)}` : ""}</div></div>
                      <div className="hidden sm:block text-right shrink-0"><div className="text-[13px] font-bold text-slate-200">{e.tenureMeses != null ? `${e.tenureMeses}m` : "—"}</div><div className="text-[10px] text-slate-500">de casa</div></div>
                      <Chevron />
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ---------------- CHECKLIST + DETALHE ---------------- */
      function ChecklistCard({ titulo, icon, itens = [] }) {
        const feitos = itens.filter((i) => i.feito).length;
        const total = itens.length;
        // Sem task no ClickUp = nada pendente -> trata como concluído (não como 0/0).
        const pct = total ? Math.round((feitos / total) * 100) : 100;
        const completo = pct === 100;
        return (
          <div className={`${CARD} p-4`}>
