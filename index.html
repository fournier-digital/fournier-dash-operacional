  <head>

    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E" />

    <!-- Versões PINADAS (= o que o float servia em 10/jul/2026): elimina o redirect 302
         por visita e habilita cache de 1 ano do CDN. Bytes idênticos ao float do dia. -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>

    <style>
      html, body { min-height: 100%; }
      body {
        background: #0a1228;
        color: #e2e8f0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }
      /* glow fixo via pseudo-elemento — evita o bug do background-attachment:fixed no iOS Safari */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(880px 420px at 80% -8%, #18306a 0%, rgba(10,18,40,0) 55%),
          radial-gradient(680px 360px at 8% -4%, #0e2c4f 0%, rgba(10,18,40,0) 52%),
          radial-gradient(760px 480px at 50% 112%, var(--fd-glow2, rgba(10,18,40,0)) 0%, rgba(10,18,40,0) 58%);
      }
      /* neon: brilho curto/nítido da própria cor (menos esfumaçado) */
      .fd-neon { text-shadow: 0 0 6px currentColor; }
      .fd-glow-on { box-shadow: 0 0 8px -3px rgba(59,130,246,.65); }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-thumb { background: #2a3a5c; border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: #384b73; }
      ::selection { background: #2563eb55; }
      button:focus-visible, a:focus-visible, select:focus-visible, [role="button"]:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; border-radius: 10px; }

      /* animações sutis — tokens de movimento */
      :root { --fd-fast:140ms; --fd-mid:240ms; --fd-enter:220ms; --fd-fill:650ms; --fd-ease:cubic-bezier(.2,.7,.3,1); --fd-ease-pop:cubic-bezier(.2,.8,.3,1.4); }
      @keyframes fdFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .fd-fade { animation: fdFade var(--fd-enter) var(--fd-ease) both; }
      /* glow vermelho: opacity num pseudo-elemento estático (composição pura, sem repaint por frame) */
      @keyframes fdGlow { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
      .fd-glow { position: relative; }
      .fd-glow::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: 0 0 16px -4px rgba(239,68,68,.42); animation: fdGlow 2.4s ease-in-out infinite; }
      @keyframes fdDot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: .55; } }
      .fd-dot { animation: fdDot 1.6s ease-in-out infinite; }
      @keyframes fdSweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(220%); } }
      .fd-skel { position: relative; overflow: hidden; background: rgba(30,41,59,.6); }
      .fd-skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(148,163,184,.13) 50%, transparent 65%); animation: fdSweep 1.6s ease-in-out infinite; }
      /* stagger de entrada das linhas (cap em 8) — curto p/ não passar sensação de lentidão */
      @keyframes fdRowIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
      .fd-stagger > * { animation: fdRowIn 220ms var(--fd-ease) both; }
      .fd-stagger > *:nth-child(1){animation-delay:0ms} .fd-stagger > *:nth-child(2){animation-delay:20ms} .fd-stagger > *:nth-child(3){animation-delay:40ms} .fd-stagger > *:nth-child(4){animation-delay:60ms} .fd-stagger > *:nth-child(5){animation-delay:80ms} .fd-stagger > *:nth-child(6){animation-delay:100ms} .fd-stagger > *:nth-child(7){animation-delay:120ms} .fd-stagger > *:nth-child(8){animation-delay:140ms} .fd-stagger > *:nth-child(n+9){animation-delay:150ms}
      /* barras de progresso: crescem da esquerda no mount (transition de width não dispara na 1ª pintura) */
      .fd-grow { transform-origin:left; animation: fdAccentIn var(--fd-fill) var(--fd-ease) both; }
      /* transição direcional (drill in/out) */
      @keyframes fdPushIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:none; } }
      @keyframes fdPushOut { from { opacity:0; transform:translateX(-16px); } to { opacity:1; transform:none; } }
      .fd-push-in { animation: fdPushIn var(--fd-enter) var(--fd-ease) both; }
      .fd-push-out { animation: fdPushOut var(--fd-enter) var(--fd-ease) both; }
      /* pop de menu / confirmação / logo */
      @keyframes fdPop { from { opacity:0; transform:scale(.96) translateY(-4px); } to { opacity:1; transform:none; } }
      .fd-pop { animation: fdPop var(--fd-fast) var(--fd-ease) both; transform-origin: top right; }
      @keyframes fdLogoIn { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
      .fd-logo { animation: fdLogoIn 550ms var(--fd-ease-pop) both; }
      /* sparkline desenhando + ponto final */
      @keyframes fdDraw { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
      .fd-spark { stroke-dasharray:1; stroke-dashoffset:1; animation: fdDraw var(--fd-fill) ease-out forwards; }
      @keyframes fdDotIn { from { opacity:0; } to { opacity:1; } }
      .fd-spark-dot { animation: fdDotIn 250ms ease-out var(--fd-fill) both; }
      /* barra de acento do squad */
      @keyframes fdAccentIn { from { transform:scaleX(0); opacity:.4; } to { transform:scaleX(1); opacity:1; } }
      .fd-accent { transform-origin:left; animation: fdAccentIn var(--fd-enter) var(--fd-ease); }
      /* dot "ao vivo" (verde) */
      @keyframes fdLive { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(16,185,129,.5)} 50%{opacity:.6;box-shadow:0 0 0 4px rgba(16,185,129,0)} }
      .fd-live { animation: fdLive 2.2s ease-in-out infinite; }
      /* reduced-motion: reset GLOBAL (cobre animação + transição + scroll) */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
        .fd-fade, .fd-push-in, .fd-push-out { opacity:1 !important; transform:none !important; }
        .fd-spark { stroke-dashoffset:0 !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      function fdErro(msg) {
        var r = document.getElementById("root");
        if (!r || r.children.length) return;
        r.innerHTML = '<div style="max-width:640px;margin:40px auto;padding:20px;background:#0f172a;border:1px solid #7f1d1d;border-radius:12px;font-family:sans-serif;color:#e2e8f0"><h2 style="color:#f87171;margin:0 0 8px">Falha ao carregar o dashboard</h2><pre style="white-space:pre-wrap;color:#cbd5e1;font-size:13px">' + msg + "</pre><p style=\"color:#94a3b8;font-size:13px\">Abra pelo servidor (http://localhost:3000) e recarregue com Cmd+Shift+R.</p></div>";
      }
      window.addEventListener("error", function (e) { fdErro((e.message || "Erro") + (e.filename ? "\n" + e.filename + ":" + e.lineno : "")); });
      window.__fdTimer = setTimeout(function () { fdErro("Tempo esgotado: o app não renderizou. Veja o console (F12)."); }, 12000);
    </script>

    <!-- Supabase JS (UMD) — armazenagem compartilhada cross-device; antes dos módulos FD -->
    <script defer src="https://unpkg.com/@supabase/supabase-js@2.110.2/dist/umd/supabase.js"></script>

    <script defer src="src/integrations/clickup.js?v=66"></script>
    <script defer src="src/integrations/googleCalendar.js?v=66"></script>
    <script defer src="src/integrations/nps.js?v=66"></script>
    <script defer src="src/integrations/controle.js?v=66"></script>
